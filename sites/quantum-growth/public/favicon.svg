<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Favicon variant: the mark sits on a dark tile and drops the zigzag for a
       single chevron. An outline mark on white has too little mass at 16px. -->
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC078"/><stop offset="1" stop-color="#F26419"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="10.5" fill="#0B0A10"/>
  <circle cx="17.5" cy="17.5" r="9.4" fill="none" stroke="url(#f)" stroke-width="4"/>
  <path d="M24.4 24.4 L31.2 31.2" fill="none" stroke="url(#f)" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M13.6 20.2 L17.6 14.6 L21.8 17.6" fill="none" stroke="url(#f)" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social share image source — Phil's Auto and Fleet Repair</title>
<!--
  Source for public/assets/img/og-cover.png (the picture that shows when the
  site is shared on Facebook, LinkedIn, iMessage, WhatsApp, X).

  Regenerate after editing:
    chrome --headless --screenshot=../public/assets/img/og-cover.png \
           --window-size=1200,630 --hide-scrollbars og-cover.html
  (any Chrome/Chromium binary works; keep the size at exactly 1200x630)
-->
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#fff;padding:64px 72px;position:relative;
    background:
      radial-gradient(700px 420px at 86% 2%,rgba(91,77,255,.46),transparent 62%),
      linear-gradient(158deg,#0a0a1f 0%,#1c1b52 52%,#0b0b26 100%);
  }
  body::after{
    content:"";position:absolute;inset:0;opacity:.11;
    background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
    background-size:58px 58px;
    -webkit-mask-image:linear-gradient(118deg,#000 10%,transparent 70%);
  }
  .inner{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
  .lockup{display:flex;align-items:center;gap:20px}
  .disc{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;
        box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .disc img{width:80px;height:80px;object-fit:contain;display:block}
  .name{font-size:31px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .sub{font-size:17px;letter-spacing:.19em;text-transform:uppercase;color:#a6a7c4;font-weight:700;margin-top:5px}
  h1{font-size:63px;font-weight:900;letter-spacing:-.035em;line-height:1.04;margin:52px 0 0;max-width:19ch}
  h1 em{font-style:normal;color:#a99bff}
  .tag{font-size:25px;color:#c9c9e4;margin-top:22px}
  .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
  .phone{font-size:38px;font-weight:900;color:#a99bff;letter-spacing:-.02em}
  .meta{font-size:20px;color:#a6a7c4;margin-top:8px}
  .stars{color:#f5a623;font-size:23px;letter-spacing:3px}
  .rating{font-size:19px;color:#c9c9e4;margin-top:6px;text-align:right}
  .rating b{color:#fff}
</style>
</head>
<body>
  <div class="inner">
    <div class="lockup">
      <span class="disc"><img src="../public/assets/img/logo.png" alt=""></span>
      <span>
        <div class="name">Phil's Auto &amp; Fleet Repair</div>
        <div class="sub">Lodi, California</div>
      </span>
    </div>
    <h1>Honest auto, diesel &amp; fleet repair in <em>Lodi</em></h1>
    <p class="tag">Diagnosis before parts. No upsells. You approve every repair.</p>
    <div class="foot">
      <div>
        <div class="phone">(209) 647-4953</div>
        <div class="meta">103 E Elm St, Lodi, CA 95240 &middot; Mon–Sat 8 AM – 5 PM<br>phil@philsautofleet.com</div>
      </div>
      <div>
        <div class="stars">★★★★★</div>
        <div class="rating"><b>4.4 out of 5</b> · 83 Google reviews</div>
      </div>
    </div>
  </div>
</body>
</html>

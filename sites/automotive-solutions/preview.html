<style>
/* Automotive Solutions by Single — design system
   Self-contained: no webfonts, no icon fonts, no external requests. */

:root{
  /* Palette sampled from the shop's logo file (assets/img/logo.png).
     The wordmark is drawn in exactly two colors: an orange fill (#eb712d)
     inside a royal-blue outline (#0c27f5). Everything here is built from
     those two — the darks are blue-black rather than neutral navy, and the
     greys carry the same blue bias so nothing reads as a stock template. */

  /* surfaces — blue-biased neutrals */
  --ink:#060a2e;
  --ink-2:#0a1145;
  --steel:#101a63;
  --paper:#ffffff;
  --paper-2:#f5f6fc;
  --paper-3:#e9ecf9;
  --line:#dfe3f4;
  --line-dark:#1e2a70;

  /* text */
  --text:#111634;
  --slate:#585f85;
  --slate-light:#a3a9c6;

  /* brand blue — carries links, nav state and anything that is text */
  --brand:#0c27f5;        /* sampled straight from the logo outline */
  --brand-dk:#0a1fc4;     /* 10.5:1 on white — safe for link text */
  --brand-lt:#8f9dff;

  /* brand orange — carries calls to action and graphic accents */
  --accent-vivid:#eb712d; /* sampled straight from the logo fill */
  --accent:#c85214;       /* 4.5:1 with white — safe under button text */
  --accent-dk:#a94208;    /* 6.1:1 with white */
  --accent-lt:#ff9455;    /* 8.8:1 on the dark ground — eyebrows, links on dark */
  --accent-soft:#fdeee3;

  --star:#f5a623;         /* review stars stay gold — that is what a rating looks like */
  --ok:#0f7a4a;

  /* composites — both ends of the CTA gradient clear 4.5:1 under white text */
  --grad-accent:linear-gradient(135deg,#c85214 0%,#a94208 100%);
  --grad-brand:linear-gradient(135deg,#1430e8 0%,#0a1fc4 100%);
  --grad-dark:linear-gradient(158deg,#060a2e 0%,#101a63 54%,#070c33 100%);
  --shadow-sm:0 1px 2px rgba(6,10,46,.06),0 2px 8px rgba(6,10,46,.05);
  --shadow:0 2px 6px rgba(6,10,46,.06),0 14px 34px rgba(6,10,46,.12);
  --shadow-lg:0 8px 20px rgba(6,10,46,.10),0 34px 70px rgba(6,10,46,.26);
  --glow:0 10px 28px rgba(200,82,20,.36);
  --glow-brand:0 10px 28px rgba(12,39,245,.30);
  --radius:16px;
  --radius-lg:22px;
  --wrap:1180px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--text);
  font-family:var(--font);font-size:17px;line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
img,svg{max-width:100%}
img{height:auto;display:block}
a{color:var(--brand-dk);text-underline-offset:3px}

h1,h2,h3,h4{margin:0 0 .5em;font-weight:800;letter-spacing:-.03em;line-height:1.08}
h1{font-size:clamp(2.3rem,1.2rem + 3.6vw,4rem);font-weight:900;letter-spacing:-.04em;line-height:1.02}
h2{font-size:clamp(1.7rem,1.15rem + 2.1vw,2.85rem);font-weight:900;letter-spacing:-.035em}
h3{font-size:1.22rem}
p{margin:0 0 1.1em}
ul,ol{margin:0 0 1.1em;padding-left:1.2em}
li{margin-bottom:.45em}

.wrap{max-width:var(--wrap);margin:0 auto;padding:0 22px}
.narrow{max-width:780px}
/* Prose columns read better on an article scale than the display scale used
   by landing sections. */
.narrow h2{font-size:clamp(1.45rem,1.1rem + 1.2vw,2rem);margin-top:1.5em}
.narrow h2:first-child{margin-top:0}
.narrow h3{font-size:1.12rem;margin-top:1.4em}
.narrow p,.narrow li{max-width:68ch}
section{padding:clamp(54px,6.5vw,104px) 0;position:relative}
.bg-alt{background:var(--paper-2)}
.bg-dark{background:var(--grad-dark);color:#e6eaf8}
.bg-dark h2,.bg-dark h3{color:#fff}
.bg-dark p{color:#bcc5e6}

.eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  font-size:.76rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent-dk);margin-bottom:1em;
}
.eyebrow::before{content:"";width:30px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent-vivid),var(--accent-dk))}
.bg-dark .eyebrow,.hero .eyebrow,.page-head .eyebrow{color:var(--accent-lt)}
.lede{font-size:1.14rem;color:var(--slate)}
.center{text-align:center}
.sec-head{max-width:740px;margin-bottom:44px}
.sec-head.center{margin-left:auto;margin-right:auto;text-align:center}
.sec-head.center .eyebrow{justify-content:center}
.sec-head p{color:var(--slate);font-size:1.08rem;margin-bottom:0}
.bg-dark .sec-head p{color:#bcc5e6}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:#fff;padding:12px 18px;font-weight:800}
.skip:focus{left:8px;top:8px}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:6px}

/* ---------------- Buttons ---------------- */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.6em;
  padding:16px 28px;border-radius:12px;font-weight:800;font-size:1.02rem;letter-spacing:-.01em;
  text-decoration:none;border:2px solid transparent;cursor:pointer;line-height:1.1;text-align:center;
  transition:transform .15s cubic-bezier(.2,.8,.3,1),box-shadow .15s ease,background .15s ease,border-color .15s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-accent{background:var(--grad-accent);color:#fff;box-shadow:var(--glow)}
.btn-accent::after{
  content:"";position:absolute;inset:2px 2px auto;height:42%;border-radius:9px 9px 20px 20px;
  background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0));pointer-events:none;
}
.btn-accent:hover{box-shadow:0 14px 36px rgba(200,82,20,.46)}
.btn-brand{background:var(--grad-brand);color:#fff;box-shadow:var(--glow-brand)}
.btn-brand:hover{box-shadow:0 14px 36px rgba(12,39,245,.4)}
.btn-dark{background:var(--ink);color:#fff;box-shadow:0 8px 22px rgba(6,10,46,.24)}
.btn-dark:hover{background:var(--steel)}
.btn-ghost{background:rgba(255,255,255,.07);color:#fff;border-color:rgba(255,255,255,.36);backdrop-filter:blur(4px)}
.btn-ghost:hover{background:rgba(255,255,255,.15);border-color:#fff}
.btn-outline{background:#fff;color:var(--text);border-color:var(--line);box-shadow:var(--shadow-sm)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent-dk)}
.btn-sm{padding:11px 19px;font-size:.94rem;border-radius:10px}
.btn-row{display:flex;flex-wrap:wrap;gap:14px}
.icon{width:1.05em;height:1.05em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------------- Header ---------------- */
.topbar{background:var(--ink);color:#98a3cd;font-size:.85rem;position:relative;z-index:2}
.topbar .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:center;padding:9px 22px}
.topbar a{color:#fff;text-decoration:none;font-weight:800}
.topbar a:hover{color:var(--accent-lt)}
.topbar .icon{color:var(--accent-lt);vertical-align:-2px;margin-right:5px}
.topbar .dot{color:#414d8c}

.site-header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.93);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;gap:20px;padding:13px 22px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);margin-right:auto;min-width:0}
.brand-mark{
  width:46px;height:46px;border-radius:13px;flex:none;background:var(--grad-accent);color:#fff;
  display:grid;place-items:center;font-weight:900;font-size:1.05rem;letter-spacing:-.04em;
  box-shadow:0 6px 16px rgba(200,82,20,.42);position:relative;overflow:hidden;
}
.brand-mark::after{content:"";position:absolute;inset:0 0 55%;background:linear-gradient(rgba(255,255,255,.3),transparent)}
.brand-text{display:flex;flex-direction:column;line-height:1.14;min-width:0}
/* The real logo (SITE["logo"] in build.py) is a full wordmark, so it stands
   alone. It shrinks with the header at the mobile breakpoint below. */
.brand-logo{height:48px;width:auto;max-width:min(300px,52vw);object-fit:contain;display:block}
.brand-logo--chip{background:#fff;padding:9px 14px;border-radius:12px}
.brand-badge{height:46px;width:46px;object-fit:contain;display:block;flex:none}
.brand-badge--chip{background:#fff;border-radius:50%;padding:3px;height:50px;width:50px}
.brand-name{font-weight:900;font-size:1.05rem;letter-spacing:-.035em}
.brand-sub{font-size:.7rem;color:var(--slate);font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:2px}
.nav a{position:relative;color:#2b3155;text-decoration:none;font-weight:800;font-size:.95rem;padding:10px 13px;border-radius:9px}
.nav a::after{content:"";position:absolute;left:13px;right:13px;bottom:5px;height:2.5px;border-radius:2px;background:linear-gradient(90deg,var(--accent-vivid),var(--accent-dk));transform:scaleX(0);transform-origin:left;transition:transform .18s ease}
.nav a:hover::after,.nav a[aria-current="page"]::after{transform:scaleX(1)}
.nav a[aria-current="page"]{color:var(--brand-dk)}
.header-cta{display:flex;align-items:center;gap:14px}
.header-phone{display:flex;flex-direction:column;text-decoration:none;color:var(--text);line-height:1.15}
.header-phone span{font-size:.68rem;color:var(--slate);font-weight:800;text-transform:uppercase;letter-spacing:.11em}
.header-phone strong{font-size:1.08rem;font-weight:900;letter-spacing:-.03em}
.header-phone:hover strong{color:var(--brand-dk)}
.nav-toggle{display:none;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:10px;cursor:pointer}
.nav-toggle svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:2.2;stroke-linecap:round;display:block}

/* ---------------- Hero ---------------- */
.hero{position:relative;color:#fff;overflow:hidden;background:var(--grad-dark);isolation:isolate}
.hero::before{
  content:"";position:absolute;inset:-20% -10% auto;height:120%;z-index:-2;
  background:
    radial-gradient(680px 380px at 84% 2%,rgba(235,113,45,.30),transparent 62%),
    radial-gradient(560px 340px at 6% 92%,rgba(12,39,245,.42),transparent 66%);
}
.hero::after{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.12;
  background-image:
    linear-gradient(rgba(255,255,255,.45) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.45) 1px,transparent 1px);
  background-size:58px 58px;
  mask-image:linear-gradient(115deg,#000 12%,transparent 72%);
  -webkit-mask-image:linear-gradient(115deg,#000 12%,transparent 72%);
}
.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:52px;align-items:center;padding:clamp(38px,3.6vw,60px) 0 clamp(58px,5vw,84px)}
.hero h1{color:#fff;margin-bottom:.3em;text-wrap:balance}
/* Both ends of this text gradient stay light enough to read on the dark ground. */
.hero h1 em{font-style:normal;background:linear-gradient(100deg,#ffbe8f,#ff8a44);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#c3cbe8;font-size:1.16rem;max-width:54ch}
.hero .btn-row{margin:30px 0 26px}
.hero-points{list-style:none;padding:0;margin:0;display:grid;gap:11px}
.hero-points li{display:flex;gap:11px;align-items:flex-start;color:#d3daf1;font-size:1rem;margin:0}
.hero-points .icon{color:#5fd9a0;margin-top:.24em;width:20px;height:20px}

.rating{display:inline-flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:22px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  padding:9px 16px;border-radius:999px;backdrop-filter:blur(6px)}
.stars{color:var(--star);letter-spacing:2.5px;font-size:1.02rem;line-height:1}
.rating-text{color:#c3cbe8;font-size:.92rem}
.rating-text strong{color:#fff}
.rating-text a{color:#fff;text-decoration:underline}
/* The same badge on a light section. */
.rating--light{background:var(--paper-2);border-color:var(--line)}
.rating--light .rating-text{color:var(--slate)}
.rating--light .rating-text strong{color:var(--text)}
.rating--light .rating-text a{color:var(--brand-dk)}

/* wave/angle transition out of dark sections */
.angle-bottom{position:absolute;left:0;right:0;bottom:-1px;height:clamp(40px,5vw,78px);z-index:1}
.angle-bottom svg{display:block;width:100%;height:100%}

/* ---------------- Quote card ---------------- */
.quote-card{
  position:relative;background:#fff;color:var(--text);border-radius:var(--radius-lg);
  padding:30px 28px 26px;box-shadow:var(--shadow-lg);overflow:hidden;
}
.quote-card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--accent-vivid),var(--brand))}
.quote-card h2{font-size:1.42rem;margin-bottom:.25em;letter-spacing:-.03em}
.quote-card .sub{color:var(--slate);font-size:.94rem;margin-bottom:20px}

.field{margin-bottom:14px}
.field label{display:block;font-weight:800;font-size:.83rem;margin-bottom:6px;letter-spacing:.01em}
.field input,.field select,.field textarea{
  width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:11px;
  font:inherit;font-size:.98rem;background:var(--paper-2);color:var(--text);transition:border-color .15s,box-shadow .15s,background .15s;
}
.field input:hover,.field select:hover,.field textarea:hover{border-color:#c3c9e6}
.field input:focus,.field select:focus,.field textarea:focus{background:#fff;border-color:var(--brand);outline:none;box-shadow:0 0 0 4px rgba(12,39,245,.15)}
.field textarea{min-height:104px;resize:vertical}
.form-note{font-size:.82rem;color:var(--slate);margin:14px 0 0;text-align:center}
.hp{position:absolute;left:-9999px}
.form-status{margin-top:14px;padding:13px 15px;border-radius:11px;font-weight:700;font-size:.93rem;display:none}
.form-status.show{display:block}
.form-status.ok{background:#e7f6ee;color:var(--ok)}
.form-status.err{background:#fdeceb;color:#b3261e}

/* ---- Light cards sitting inside a dark section --------------------------
   .hero, .page-head and .bg-dark each color their own <p>, and a selector
   like `.hero p` outranks a bare `.form-note` on specificity. So any white
   card placed inside one of them has to restate its own text colors, or the
   fine print comes out near-white on white. */
.hero .quote-card,.page-head .quote-card,.bg-dark .quote-card,
.hero .panel:not(.panel-accent),.page-head .panel:not(.panel-accent),
.bg-dark .panel:not(.panel-accent){color:var(--text)}

.hero .quote-card p,.page-head .quote-card p,.bg-dark .quote-card p,
.hero .panel:not(.panel-accent) p,.page-head .panel:not(.panel-accent) p,
.bg-dark .panel:not(.panel-accent) p{color:var(--slate);font-size:.94rem;max-width:none}

.hero .quote-card .form-note,.page-head .quote-card .form-note,
.bg-dark .quote-card .form-note{font-size:.82rem}

.hero .quote-card h2,.page-head .quote-card h2,.bg-dark .quote-card h2,
.hero .panel:not(.panel-accent) h3,.page-head .panel:not(.panel-accent) h3,
.bg-dark .panel:not(.panel-accent) h3{color:var(--text)}

.hero .quote-card label,.page-head .quote-card label,
.bg-dark .quote-card label{color:var(--text)}

/* ---------------- Stat band ---------------- */
/* Deliberately overlaps the section edge above it. */
.statband{position:relative;z-index:2;margin-top:calc(-1 * clamp(38px,4vw,62px))}
.statband + section,.statband + .listed + section{padding-top:clamp(44px,4.5vw,70px)}
.statband-inner{
  background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden;
}
.stat{padding:26px 24px;border-right:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.stat:last-child{border-right:0}
.stat-ico{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent-dk);display:grid;place-items:center;flex:none}
.stat-ico .icon{width:22px;height:22px}
.stat b{display:block;font-size:1.28rem;font-weight:900;letter-spacing:-.035em;line-height:1.15}
.stat span{display:block;font-size:.86rem;color:var(--slate);line-height:1.4}

/* ---------------- Listed-on strip ---------------- */
.listed{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper-2)}
.listed .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px 34px;padding:20px 22px}
.listed .label{font-size:.72rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--slate)}
.listed span.src,.listed a.src{font-weight:900;font-size:1.02rem;color:#63698f;letter-spacing:-.02em;text-decoration:none}
.listed a.src:hover{color:var(--brand-dk)}

/* ---------------- Cards ---------------- */
.grid{display:grid;gap:24px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{
  position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:28px 26px;overflow:hidden;
  transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s ease,border-color .18s ease;
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent-vivid),var(--accent-dk));
  transform:scaleX(0);transform-origin:left;transition:transform .22s ease;
}
.card h3{margin-bottom:.4em;letter-spacing:-.03em}
.card p{color:var(--slate);font-size:.96rem;margin-bottom:1em}
.card .more{font-weight:900;font-size:.9rem;text-decoration:none;display:inline-flex;align-items:center;gap:.4em;color:var(--brand-dk)}
.card .more .icon{transition:transform .18s ease}
a.card{display:flex;flex-direction:column;text-decoration:none;color:inherit}
.card .more{margin-top:auto}
a.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:#c9d0ec}
a.card:hover::before{transform:scaleX(1)}
a.card:hover .more .icon{transform:translateX(4px)}
.card-ico{
  width:54px;height:54px;border-radius:15px;background:var(--grad-accent);color:#fff;
  display:grid;place-items:center;margin-bottom:17px;position:relative;overflow:hidden;
  box-shadow:0 8px 18px rgba(200,82,20,.34);
  transition:transform .2s ease,box-shadow .2s ease;
}
.card-ico::after{content:"";position:absolute;inset:0 0 55%;background:linear-gradient(rgba(255,255,255,.28),transparent)}
.card-ico .icon{width:26px;height:26px;stroke-width:1.9}
a.card:hover .card-ico{transform:scale(1.06) rotate(-5deg);box-shadow:0 12px 26px rgba(200,82,20,.46)}

/* ---------------- Comparison table ---------------- */
.compare{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:.97rem;box-shadow:var(--shadow)}
.compare th,.compare td{padding:16px 18px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.compare thead th{background:var(--ink);color:#fff;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;font-weight:900}
.compare thead th:nth-child(2){background:var(--grad-accent)}
.compare tbody tr:nth-child(even){background:var(--paper-2)}
.compare tbody tr:last-child td,.compare tbody tr:last-child th{border-bottom:0}
.compare tbody th{font-weight:800;width:32%}
.compare td.yes{color:var(--ok);font-weight:800}
.compare td.yes::before{content:"✓ ";font-weight:900}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius)}

/* ---------------- Reviews ---------------- */
.review{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:30px 26px 26px;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
.review::before{
  content:"”";position:absolute;top:-6px;right:20px;font-size:5.4rem;line-height:1;
  color:var(--accent-vivid);opacity:.20;font-family:Georgia,serif;
}
.review--theme::before{content:none}
.review .stars{margin-bottom:12px}
.review blockquote{margin:0 0 16px;font-size:1.03rem;line-height:1.58;font-weight:500}
.review cite{font-style:normal;font-size:.84rem;color:var(--slate);margin-top:auto}
.review cite strong{display:block;color:var(--text);font-size:.94rem}
.review h3{margin-bottom:.35em}
.review--theme .card-ico{margin-bottom:15px}
.review-links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:34px}

/* ---------------- Steps ---------------- */
.steps{counter-reset:step;display:grid;gap:26px;grid-template-columns:repeat(3,1fr)}
.step{position:relative;padding:30px 26px 26px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.step::before{
  counter-increment:step;content:counter(step,decimal-leading-zero);
  display:block;font-size:2.1rem;font-weight:900;letter-spacing:-.05em;line-height:1;
  background:var(--grad-accent);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;
}
.step h3{margin-bottom:.35em}
.step p{color:var(--slate);font-size:.97rem;margin:0}
.bg-dark .step{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);box-shadow:none}
.bg-dark .step p{color:#bcc5e6}
.bg-dark .step::before{background:linear-gradient(135deg,#ffbe8f,#ff8a44);-webkit-background-clip:text;background-clip:text}

/* ---------------- CTA band ---------------- */
.cta-band{
  position:relative;overflow:hidden;border-radius:var(--radius-lg);color:#fff;
  background:var(--grad-dark);padding:clamp(34px,4.4vw,58px);
  display:flex;flex-wrap:wrap;gap:28px;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow-lg);
}
.cta-band::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(600px 300px at 88% 12%,rgba(235,113,45,.30),transparent 62%),
             radial-gradient(500px 260px at 6% 96%,rgba(12,39,245,.36),transparent 66%);
}
.cta-band > *{position:relative}
.cta-band h2{color:#fff;margin-bottom:.3em}
.cta-band p{color:#c3cbe8;margin:0;max-width:50ch}

/* ---------------- FAQ ---------------- */
.faq{max-width:880px}
.faq details{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;transition:box-shadow .18s ease,border-color .18s ease}
.faq details[open]{box-shadow:var(--shadow);border-color:#c9d0ec}
.faq summary{cursor:pointer;list-style:none;padding:19px 56px 19px 22px;font-weight:800;position:relative;font-size:1.03rem;letter-spacing:-.02em}
.faq summary::-webkit-details-marker{display:none}
.faq summary:hover{color:var(--brand-dk)}
.faq summary::after{
  content:"";position:absolute;right:22px;top:50%;width:11px;height:11px;margin-top:-7px;
  border-right:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);
  transform:rotate(45deg);transition:transform .2s ease;
}
.faq details[open] summary::after{transform:rotate(-135deg);margin-top:-2px}
.faq .answer{padding:0 22px 20px;color:var(--slate)}
.faq .answer p:last-child{margin-bottom:0}

/* ---------------- Breadcrumbs / page head ---------------- */
.crumbs{font-size:.85rem;color:var(--slate);padding:18px 0 0}
.crumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0}
.crumbs li{margin:0}
.crumbs a{color:var(--slate);text-decoration:none}
.crumbs a:hover{color:var(--brand-dk);text-decoration:underline}
.crumbs li+li::before{content:"›";margin-right:8px;color:#9098bd}

.page-head{position:relative;overflow:hidden;background:var(--grad-dark);color:#fff;padding:clamp(30px,3.6vw,48px) 0 clamp(58px,7vw,96px)}
.page-head::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(720px 400px at 88% -10%,rgba(235,113,45,.26),transparent 62%),
             radial-gradient(520px 320px at 2% 100%,rgba(12,39,245,.40),transparent 66%);
}
.page-head::after{
  content:"";position:absolute;inset:0;opacity:.1;
  background-image:linear-gradient(rgba(255,255,255,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.45) 1px,transparent 1px);
  background-size:58px 58px;mask-image:linear-gradient(120deg,#000,transparent 68%);
  -webkit-mask-image:linear-gradient(120deg,#000,transparent 68%);
}
.page-head .wrap{position:relative;z-index:1}
.page-head h1{color:#fff;max-width:26ch;text-wrap:balance}
.page-head p{color:#c3cbe8;font-size:1.12rem;max-width:60ch;margin-bottom:0}
.page-head .crumbs,.page-head .crumbs a{color:#98a3cd}
.page-head .crumbs a:hover{color:var(--accent-lt)}
.page-head .btn-row{margin-top:28px}

/* ---------------- Content blocks ---------------- */
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:start}
.split.center-y{align-items:center}
.checklist{list-style:none;padding:0;margin:0;display:grid;gap:13px}
.checklist li{display:flex;gap:12px;align-items:flex-start;margin:0;font-size:1rem}
.checklist .icon{color:#fff;background:var(--grad-accent);border-radius:50%;padding:4px;width:22px;height:22px;margin-top:.2em;flex:none;stroke-width:3;box-shadow:0 3px 8px rgba(200,82,20,.36)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:30px;box-shadow:var(--shadow)}
.panel h3{margin-top:0}
.panel-accent{border:0;background:var(--grad-dark);color:#e6eaf8;position:relative;overflow:hidden}
.panel-accent h3{color:#fff}
.panel-accent p{color:#bcc5e6}
.panel-accent a{color:#fff}
.panel-accent::before{content:"";position:absolute;inset:0;background:radial-gradient(400px 220px at 92% 0,rgba(235,113,45,.28),transparent 66%),radial-gradient(360px 220px at 0 100%,rgba(12,39,245,.34),transparent 68%)}
.panel-accent > *{position:relative}
.tag-row{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 8px;padding:0;list-style:none}
.tag{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 17px;font-size:.9rem;font-weight:800;color:#2b3155;text-decoration:none;transition:all .16s ease}
a.tag:hover{border-color:var(--accent);color:var(--accent-dk);transform:translateY(-2px);box-shadow:var(--shadow-sm)}

/* Photo slot — styled frame that ships with a hand-drawn illustration.
   Swap the <img> inside for a real photo; see the HTML comment above each. */
.photo{
  position:relative;border-radius:var(--radius-lg);overflow:hidden;background:var(--grad-dark);
  box-shadow:var(--shadow-lg);margin:0;border:1px solid rgba(255,255,255,.10);
}
.photo img,.photo svg{width:100%;height:auto;display:block;aspect-ratio:16/10;object-fit:cover}
/* The caption sits under the image, never over it. */
.photo figcaption{
  padding:15px 20px;color:#c3cbe8;font-size:.87rem;line-height:1.5;
  background:rgba(4,7,26,.6);border-top:1px solid rgba(255,255,255,.1);
}
.photo-badge{
  position:absolute;top:18px;left:18px;z-index:2;background:rgba(6,10,46,.72);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:8px 15px;
  font-size:.78rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;gap:8px;align-items:center;
}
.photo-badge .icon{width:15px;height:15px;color:var(--accent-lt)}

/* ---------------- Hours / map ---------------- */
.hours{width:100%;border-collapse:collapse;font-size:.98rem}
.hours th{text-align:left;font-weight:800;padding:11px 0;border-bottom:1px solid var(--line)}
.hours td{text-align:right;padding:11px 0;border-bottom:1px solid var(--line);color:var(--slate)}
.hours tr:last-child th,.hours tr:last-child td{border-bottom:0}
.hours .closed{color:#62688e}
.panel-accent .hours th{color:#fff;border-color:rgba(255,255,255,.13)}
.panel-accent .hours td{color:#bcc5e6;border-color:rgba(255,255,255,.13)}
.map-frame{border:0;width:100%;height:430px;border-radius:var(--radius-lg);display:block;box-shadow:var(--shadow);background:var(--grad-dark)}
.map-note{margin:14px 0 0;font-size:.92rem}
.map-note a{display:inline-flex;align-items:center;gap:.4em;font-weight:800;text-decoration:none}
.map-note a:hover{text-decoration:underline}

/* ---------------- Footer ---------------- */
.site-footer{position:relative;background:var(--ink);color:#9aa8cc;padding:70px 0 26px;font-size:.94rem;overflow:hidden}
.site-footer::before{
  content:"";position:absolute;inset:0;opacity:.07;
  background-image:linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.4) 1px,transparent 1px);
  background-size:58px 58px;mask-image:linear-gradient(#000,transparent 60%);-webkit-mask-image:linear-gradient(#000,transparent 60%);
}
.site-footer .wrap{position:relative}
.site-footer h4{color:#fff;font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:1.2em}
.site-footer a{color:#ccd4ee;text-decoration:none}
.site-footer a:hover{color:var(--accent-lt)}
.site-footer p{color:#9aa8cc}
.footer-grid{display:grid;grid-template-columns:1.45fr 1fr 1fr 1.15fr;gap:40px}
.footer-grid ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.footer-grid li{margin:0}
.footer-brand .brand{color:#fff;margin-bottom:16px}
.footer-brand .brand-sub{color:#8f9ac2}
.footer-bottom{border-top:1px solid #1a2360;margin-top:48px;padding-top:22px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:.85rem;color:#8089b4}
.footer-bottom a{color:#9aa8cc}

/* ---------------- Mobile call bar ---------------- */
.callbar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;
  background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  box-shadow:0 -8px 26px rgba(6,10,46,.16);
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  grid-template-columns:repeat(3,1fr);gap:8px;
}
.callbar a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;font-size:.75rem;font-weight:900;color:var(--text);padding:8px 4px;border-radius:11px}
.callbar a.primary{background:var(--grad-accent);color:#fff;box-shadow:var(--glow)}
.callbar .icon{width:19px;height:19px}

/* ---------------- Responsive ---------------- */
@media (max-width:1040px){
  .hero-grid{grid-template-columns:1fr;gap:38px}
  .g4{grid-template-columns:repeat(2,1fr)}
  .footer-grid{grid-template-columns:1fr 1fr;gap:34px}
  .statband-inner{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
/* Below this width the desktop call-to-action is hidden and the brand shrinks,
   so the header cannot overflow on a narrow phone. */
@media (max-width:940px){
  .nav{
    display:none;position:absolute;top:100%;left:0;right:0;background:#fff;
    border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;
    padding:10px 18px 20px;gap:2px;box-shadow:var(--shadow);
  }
  .nav.open{display:flex}
  .nav a{padding:14px 10px;border-bottom:1px solid var(--paper-2)}
  .nav a::after{display:none}
  .header-inner{position:relative;gap:12px}
  .header-cta{display:none}
  .nav-toggle{display:block;order:3}
  .brand-name{font-size:.98rem}
  .brand-logo{height:40px;max-width:min(230px,58vw)}
  .brand-badge{height:40px;width:40px}
  .brand-sub{font-size:.64rem}
  .g3,.g2,.steps,.split{grid-template-columns:1fr}
  .split{gap:36px}
  body{padding-bottom:74px}
  .callbar{display:grid}
  .topbar .wrap{font-size:.79rem;gap:6px 16px}
  .statband{margin-top:calc(-1 * clamp(30px,4vw,50px))}
}
@media (max-width:560px){
  body{font-size:16px}
  .g4,.statband-inner{grid-template-columns:1fr}
  .stat{border-right:0;border-bottom:1px solid var(--line)}
  .stat:last-child{border-bottom:0}
  .footer-grid{grid-template-columns:1fr}
  .btn{width:100%}
  .btn-row{flex-direction:column}
  .cta-band{flex-direction:column;align-items:flex-start}
  .card,.review,.step{padding:24px 22px}
  .quote-card{padding:26px 22px 22px}
  .listed .wrap{gap:10px 20px}
  .listed span.src,.listed a.src{font-size:.92rem}
  .header-inner{padding:11px 16px}
  .brand-logo{height:36px;max-width:min(200px,60vw)}
}
@media (max-width:380px){
  .brand-logo{height:32px;max-width:56vw}
  .nav-toggle{padding:8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media print{
  .site-header,.callbar,.topbar,.cta-band,.site-footer,.hero::before,.hero::after{display:none}
  body{font-size:12pt}
}

  <div class="sec-head"><span class="eyebrow">Questions</span><h2>Frequently asked questions</h2></div>
  <div class="faq"><details><summary>Where is Automotive Solutions located?</summary><div class="answer"><p>We are at 9253 Elk Grove Blvd, Elk Grove, CA 95624, in Old Town Elk Grove just east of Highway 99. Call (916) 686-5277 for directions or to check the schedule.</p></div></details><details><summary>What are your hours?</summary><div class="answer"><p>We are open Monday through Friday, 9:00 AM to 6:00 PM, and closed Saturday and Sunday.</p></div></details><details><summary>How long have you been in business?</summary><div class="answer"><p>Automotive Solutions has been serving Elk Grove drivers since 2001 as a family owned and operated shop.</p></div></details><details><summary>Are your technicians certified?</summary><div class="answer"><p>Yes. Our technicians are ASE certified — tested and certified by the National Institute for Automotive Service Excellence — and we are a NAPA AutoCare Center.</p></div></details><details><summary>Is there a warranty on your work?</summary><div class="answer"><p>Qualifying repairs at a NAPA AutoCare Center are covered by the NAPA Peace of Mind Warranty: 24 months or 24,000 miles on parts and labor, honored at NAPA AutoCare Centers nationwide. Ask us to confirm the coverage that applies to your repair before we start.</p></div></details><details><summary>Do you work on import vehicles?</summary><div class="answer"><p>Yes. We provide repair, service and maintenance on all makes and models of domestic and import vehicles.</p></div></details><details><summary>Will servicing my car here void the factory warranty?</summary><div class="answer"><p>No. Under the federal Magnuson-Moss Warranty Act, a manufacturer cannot void your warranty simply because an independent shop did the maintenance — as long as the work is done correctly and to specification. Keep your receipts and you are covered.</p></div></details><details><summary>Do you charge for a diagnosis?</summary><div class="answer"><p>Diagnostic time is real work — testing and verifying rather than swapping parts and hoping. Call us and we will tell you what the diagnosis costs and what it covers before you come in.</p></div></details><details><summary>What areas do you serve?</summary><div class="answer"><p>Elk Grove first, plus Laguna, Sacramento, Wilton, Galt, Florin, Vineyard, Sheldon, Franklin and the surrounding south Sacramento County area.</p></div></details></div>
</div></section>

        <h2>Twenty-plus years on Elk Grove Boulevard</h2>
        <p>Automotive Solutions by Single is a family owned and operated shop at
        9253 Elk Grove Blvd, Elk Grove, CA 95624, serving Elk Grove drivers since 2001. It is run by
        Mike and Valerie Single, and in more than two decades it has repaired thousands of vehicles
        for people who live and work in this town.</p>
        <p>We provide expert repairs, service and maintenance on all makes and models of domestic
        and import vehicles. Our technicians are ASE certified, and we use up-to-date diagnostic
        equipment and quality parts on every job that comes through the bay.</p>
        <h2 style="margin-top:1.6em">How we work</h2>
        <ul class="checklist">
          <li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span><strong>Diagnose first.</strong> A trouble code is a starting point, not an answer. We test until we can point at the failure.</span></li>
          <li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span><strong>Explain it plainly.</strong> You should understand what failed and why before you spend money on it.</span></li>
          <li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span><strong>Quote before we start.</strong> Nothing gets repaired without your approval — including anything we find along the way.</span></li>
          <li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span><strong>Separate urgent from optional.</strong> We will tell you what can safely wait. That is not lost revenue; that is why people come back.</span></li>
          <li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span><strong>Back it in writing.</strong> Qualifying repairs carry the NAPA Peace of Mind Warranty — 24 months or 24,000 miles, nationwide.</span></li>
        </ul>
        <h2 style="margin-top:1.6em">What being a NAPA AutoCare Center means</h2>
        <p>NAPA AutoCare is a network of independent repair shops that agree to a common standard.
        Member shops employ ASE certified technicians, use quality parts, and honor each other's
        warranty work. In practice that means if something we repaired gives you trouble while you
        are out of town, another member shop can look after it under the same coverage.</p>
        <p>It also means an independent business does not have to ask you to take its word for
        anything. You can look us up in NAPA's own directory, on the Better Business Bureau, and on
        Google and Yelp — all of them are linked from this site.</p>

    <h1>Why your AC stops being cold in a valley summer</h1>
    <p>Refrigerant is not consumed. If the system is low, it is leaking — and here is what that means.</p>
  </div>
  <div class="angle-bottom" aria-hidden="true"><svg viewBox="0 0 1440 80" preserveAspectRatio="none"><path d="M0 80 1440 0v80z" fill="#ffffff"/></svg></div>
</div>

<section>
  <div class="wrap narrow">
    <h2>The thing nobody explains at the counter</h2><p>Air conditioning is a sealed system. Refrigerant is not a consumable like oil or fuel — it circulates and it is not used up. So if your system is low, that refrigerant went somewhere, and the only place it can go is out.</p><p>This is why a recharge on its own is a temporary measure. The system will lose charge again at whatever rate it was losing it before, and you will be back in the same place — often just as the weather turns hot.</p><h2>Why Elk Grove summers are hard on AC</h2><p>Sacramento Valley summers regularly run well above 100°F, and an air conditioning system works hardest exactly when the ambient temperature is highest. A system that is marginal in April is often a system that fails in July.</p><p>Heat also ages the rubber and the seals that hold the refrigerant in. That is a large part of why AC leaks tend to develop in older vehicles here faster than they do in milder climates.</p><h2>What the symptom usually tells us</h2><ul><li><strong>Cool but never cold, worst at idle</strong> — often low charge or a condenser airflow problem</li><li><strong>Cold for a few weeks after a recharge, then fading</strong> — a leak, essentially always</li><li><strong>Loud clicking or a squeal when the AC switches on</strong> — compressor clutch or belt</li><li><strong>Musty or sour smell from the vents</strong> — usually the evaporator or a cabin filter, not the refrigerant circuit at all</li><li><strong>Blows cold on one side only</strong> — often a blend door or actuator, which is a control fault rather than a refrigerant one</li><li><strong>No air at all</strong> — blower motor or resistor, again not a refrigerant problem</li></ul><h2>What a proper AC diagnosis involves</h2><ul><li>Measuring high and low side pressures with the system running</li><li>Checking vent temperature against ambient, which tells you how the system is actually performing</li><li>Leak detection — dye, an electronic sniffer, or both, depending on the system</li><li>Inspecting the compressor, condenser, lines and seals for the physical evidence</li><li>Confirming that the cooling fans and airflow across the condenser are doing their job</li></ul><h2>The best time to deal with it</h2><p>Spring. Every shop in Elk Grove is at its busiest for AC work during the first genuinely hot week of the year, and that is the worst time to discover you need a compressor. If the AC was not quite right last summer, it will not have healed over the winter.</p>
    <div class="panel panel-accent" style="margin-top:2em">
      <h3>The short version</h3>
      <p style="margin-bottom:1.2em">A system that is low on refrigerant has a leak. A recharge without finding it buys you weeks, not seasons.</p>

    <h1>What your check engine light actually means</h1>
    <p>Steady or flashing, what the difference means, and what it costs to find out for certain.</p>
  </div>
  <div class="angle-bottom" aria-hidden="true"><svg viewBox="0 0 1440 80" preserveAspectRatio="none"><path d="M0 80 1440 0v80z" fill="#ffffff"/></svg></div>
</div>

<section>
  <div class="wrap narrow">
    <h2>Steady light versus flashing light</h2><p>There is one distinction worth knowing before anything else. A <strong>steady</strong> check engine light means the car has recorded a fault it wants looked at. You can usually keep driving gently and get it seen in the next few days.</p><p>A <strong>flashing</strong> check engine light means an active misfire is dumping unburned fuel into the exhaust. That can destroy a catalytic converter in minutes — a cheap repair turning into an expensive one while you drive. Pull over somewhere safe and call a shop.</p><h2>Why a free code read is not a diagnosis</h2><p>A parts store will happily read your codes for free, and it is a genuinely useful starting point. But a code identifies which circuit reported a problem, not which component failed.</p><p>The classic example is P0171, 'system too lean'. That code can be caused by a vacuum leak, a dirty mass airflow sensor, a weak fuel pump, a clogged filter, a leaking injector or a failing oxygen sensor. Replacing parts in order of price until the light goes out is a strategy — it is just an expensive one.</p><h2>What a real diagnosis involves</h2><ul><li>Reading the codes with freeze-frame data, which captures the conditions when the fault occurred</li><li>Watching live sensor data while the engine runs, to see what is actually happening</li><li>Testing the suspect components directly rather than inferring from the code</li><li>Checking for related faults that a single code would not reveal</li><li>A road test where the symptom only appears while driving</li></ul><h2>Common causes, roughly in order of how often we see them</h2><ul><li>A loose or failed fuel cap — genuinely common, and genuinely cheap</li><li>Oxygen sensor faults, often reported after a different underlying problem</li><li>Ignition faults — coils, plugs, wires — showing up as misfire codes</li><li>Vacuum leaks from aged hoses and gaskets, which valley heat accelerates</li><li>Mass airflow sensor contamination</li><li>Catalytic converter efficiency codes, usually the consequence of something else</li><li>Evaporative emissions leaks, which frequently cause a smog failure</li></ul><h2>When it is worth paying for diagnostic time</h2><p>If the light is on and the car drives normally, diagnostic time is what stops you buying three parts to fix one problem. It is the cheapest part of the repair, and it is the part that determines whether the rest of your money is well spent.</p><p>Call us at (916) 686-5277 and we will tell you what a diagnosis costs and what it covers before you bring the car in.</p>
    <div class="panel panel-accent" style="margin-top:2em">
      <h3>The short version</h3>
      <p style="margin-bottom:1.2em">A flashing light means stop driving. A steady light means get it diagnosed soon. Either way, a code is a clue, not an answer.</p>

    <h1>Does using an independent shop void my warranty?</h1>
    <p>The short answer is no, and there is a federal law that says so. Here is how it works.</p>
  </div>
  <div class="angle-bottom" aria-hidden="true"><svg viewBox="0 0 1440 80" preserveAspectRatio="none"><path d="M0 80 1440 0v80z" fill="#ffffff"/></svg></div>
</div>

<section>
  <div class="wrap narrow">
    <h2>The law that settles it</h2><p>The <strong>Magnuson-Moss Warranty Act</strong> is a US federal law dating from 1975. Among other things, it stops a manufacturer from conditioning your warranty on using their dealership or their branded parts — unless they provide those parts and that service free of charge.</p><p>In plain terms: a carmaker cannot tell you that an oil change at an independent shop voids your powertrain warranty. If a dealer implies otherwise, they are describing a preference, not a rule.</p><h2>What the manufacturer can still do</h2><p>The protection is not unlimited, and it is worth understanding the edge. A manufacturer can deny a specific warranty claim if they can show that the aftermarket part or the outside repair actually caused the failure they are being asked to pay for.</p><p>That is a much narrower thing than voiding the warranty. It is claim-specific, and the burden of showing the connection is on them, not on you.</p><h2>What you should keep</h2><ul><li>Receipts and invoices for every service, showing the date and mileage</li><li>A record of what was done and which parts were used</li><li>Proof that the maintenance was performed at the interval the manufacturer specifies</li><li>The maintenance schedule from your owner's manual, so you know what those intervals actually are</li></ul><h2>How this works at our shop</h2><p>We service vehicles that are still under factory warranty regularly. The work is done to manufacturer specification with quality parts, and you get an invoice that states what was done and when — which is exactly the documentation you would need if a claim were ever questioned.</p><p>On top of that, qualifying repairs here carry the NAPA Peace of Mind Warranty: 24 months or 24,000 miles on parts and labor, honored at NAPA AutoCare Centers nationwide. That is coverage in addition to whatever the manufacturer still owes you, not instead of it.</p><h2>What about a recall or a warranty repair itself?</h2><p>Those are different. If a repair is covered under the factory warranty, or the vehicle is subject to a recall or a manufacturer service campaign, the dealership does that work at no cost to you and you should let them. We will tell you when that is the case — sending you to the dealer for free work is better for you than charging you for it here.</p>
    <div class="panel panel-accent" style="margin-top:2em">
      <h3>The short version</h3>
      <p style="margin-bottom:1.2em">Using an independent shop does not void your factory warranty. Keep your receipts, have the work done to specification, and you are protected.</p>

    <h1>Is this repair worth it on a car this old?</h1>
    <p>A framework for the moment when the quote is large and the car is not new.</p>
  </div>
  <div class="angle-bottom" aria-hidden="true"><svg viewBox="0 0 1440 80" preserveAspectRatio="none"><path d="M0 80 1440 0v80z" fill="#ffffff"/></svg></div>
</div>

<section>
  <div class="wrap narrow">
    <h2>The comparison most people make, and why it misleads</h2><p>The instinct is to compare the repair bill against what the car is worth. A $2,000 repair on a car worth $4,000 sounds obviously bad on that arithmetic.</p><p>But you are not choosing between the repair and the cash. You are choosing between the repair and whatever it costs to put a different vehicle on your driveway — which includes a down payment, tax, registration, insurance changes and, usually, monthly payments.</p><h2>A better question: cost per month of reliable use</h2><p>Take the repair cost and divide it by the number of months you would realistically keep driving the car afterwards. A $2,000 repair that buys two more good years is about $83 a month. Compare that with a car payment.</p><p>This only works if the estimate of remaining life is honest, which is the part a shop has to help with. That means an assessment of the rest of the vehicle — not just the thing that broke.</p><h2>What actually goes into that judgement</h2><ul><li>The condition of the other major systems: engine, transmission, brakes, suspension</li><li>Rust and structural condition, which is far less of an issue here than in a snow-belt state</li><li>Maintenance history — a car that has been looked after tends to keep behaving</li><li>Whether this failure is a one-off or a symptom of general wear</li><li>How the vehicle is used: a 20-mile commute is very different from occasional errands</li><li>What a comparable replacement genuinely costs right now, not what it cost in 2019</li></ul><h2>When we tell people not to spend it</h2><p>There are cars we advise against repairing. When the transmission is going and the engine has a knock, or the estimate is a fraction of a much larger list of things the vehicle needs, spending the money is throwing good after bad — and we would rather say so than take the job.</p><p>That conversation costs us a repair order and it is why people come back years later. If you are facing a decision like this, bring the car in and we will give you the real picture, including the parts you will not enjoy hearing.</p><h2>Before you decide</h2><ul><li>Get the diagnosis in writing, with the specific failure named</li><li>Ask what else the vehicle needs in the next twelve months</li><li>Ask what the repair is warrantied for — at a NAPA AutoCare Center qualifying repairs carry 24 months / 24,000 miles nationwide</li><li>Get a second opinion if the number is large and the explanation was thin</li></ul>
    <div class="panel panel-accent" style="margin-top:2em">
      <h3>The short version</h3>
      <p style="margin-bottom:1.2em">Compare the repair against a year of payments on a replacement, not against the car's resale value. The right question is cost per month of reliable use.</p>
      <div class="btn-row">
        <a class="btn btn-accent" href="tel:+19166865277" data-loc="guide"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.4 1.8.6 2.8.8a2 2 0 0 1 1.7 2z"/></svg><span>Call (916) 686-5277</span></a>

      </div>
    </div>
    <p style="margin-top:2em;color:var(--slate);font-size:.9rem">Written by the team at
      Automotive Solutions by Single, 9253 Elk Grove Blvd, Elk Grove, CA 95624. General guidance, not a substitute for having your

    <h1>Timing belt or chain — and when it has to be done</h1>
    <p>The cheapest expensive job on your car — if it is done before it fails rather than after.</p>
  </div>
  <div class="angle-bottom" aria-hidden="true"><svg viewBox="0 0 1440 80" preserveAspectRatio="none"><path d="M0 80 1440 0v80z" fill="#ffffff"/></svg></div>

<section>
  <div class="wrap narrow">
    <h2>What the timing component actually does</h2><p>Your engine's valves have to open and close in exact time with the pistons moving up and down. A timing belt or chain is what keeps those two halves synchronised.</p><p>A belt is rubber-based with fibre reinforcement, runs quietly, and wears out on a schedule. A chain is metal, is generally designed to last the life of the engine, and depends on oil pressure and tensioners to stay properly tight.</p><h2>Interference versus non-interference — the expensive distinction</h2><p>In an <strong>interference</strong> engine, the valves and the pistons occupy the same space at different moments. If the belt breaks, timing is lost instantly, the pistons strike the open valves, and you are looking at bent valves and possibly worse. In a <strong>non-interference</strong> engine the same failure leaves you stranded but does not usually destroy anything.</p><p>Most modern engines are interference designs. Which one you have determines whether a snapped belt is a tow truck or a rebuild — and it is worth knowing for your specific vehicle rather than guessing.</p><h2>Why the water pump goes in at the same time</h2><p>On many belt-driven engines the water pump is driven by the timing belt and sits behind the same covers. Getting to it is most of the labor of the job.</p><p>Replacing a perfectly good water pump feels wasteful right up until it fails 18 months later and you pay that same labor a second time. The same reasoning applies to tensioners and idler pulleys, which is why a proper timing belt job is a kit, not just a belt.</p><h2>Signs a chain is in trouble</h2><ul><li>A rattle or slap from the front of the engine, worst on a cold start</li><li>A timing-related trouble code, often correlating cam and crank position</li><li>Rough running or a loss of power that came on gradually</li><li>A history of missed oil changes — chain tensioners run on oil pressure, and dirty oil is how chains fail early</li></ul><h2>How to find out where you stand</h2><p>Tell us your year, make and model and we will tell you whether your engine uses a belt or a chain, what the manufacturer's replacement interval is, and whether it is an interference design.</p><p>If you bought the car used and there is no record of the belt ever being changed, that is worth resolving. An unknown history on an interference engine is a risk with a known price, and the belt is much cheaper than the alternative.</p>
    <div class="panel panel-accent" style="margin-top:2em">
      <h3>The short version</h3>
      <p style="margin-bottom:1.2em">If your engine uses a belt, it is a scheduled service with a mileage number. Doing it on time is maintenance; doing it late can be an engine.</p>

<section>
  <div class="wrap">
    <div class="split">
      <div>
        <p>In a Sacramento Valley summer, air conditioning is not a luxury. And a system that is low on refrigerant is low for a reason: refrigerant is not consumed, it leaks. A recharge without finding the leak is a repair with an expiry date.</p><p>We test the system, find where it is losing charge, and tell you what the actual repair costs. Same approach in winter — a heater complaint is usually a cooling system problem wearing a disguise.</p>
        <h2>What this service covers</h2>
        <ul class="checklist"><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>AC performance testing and full system diagnosis</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Refrigerant leak detection and repair</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Compressor, condenser and evaporator service</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Evacuate and recharge to manufacturer specification</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Blower motor, blend door and climate control faults</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Heater core and heating-system diagnosis</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Cabin air filter replacement</span></li></ul>
        <h2 style="margin-top:1.8em">Signs it's time to call us</h2>
        <ul><li>Air blows cool but never cold, especially sitting at a light</li><li>AC works for a few weeks after a recharge, then fades again</li><li>A musty or sour smell from the vents</li><li>Loud clicking or squealing when the AC switches on</li><li>The heater blows cold, or only warms up on the freeway</li><li>Windows fog up and will not clear</li></ul>
        <p>If any of these sound like your vehicle, call <a href="tel:+19166865277"
        data-loc="service-body">(916) 686-5277</a>. We will tell you what we think it is,
        what it takes to know for certain, and what that costs — before you commit to anything.</p>
        <h2 style="margin-top:1.8em">Serving Elk Grove and south Sacramento County</h2>
        <p>Automotive Solutions is at 9253 Elk Grove Blvd, Elk Grove, CA 95624, in Old Town Elk Grove just east of
        Highway 99. We handle ac &amp; heating for drivers across
        Elk Grove, Laguna, Sacramento, Wilton, Galt, Florin, Vineyard, Sheldon, Franklin and Rancho Cordova.</p>

    <div class="split">
      <div>
        <p>The hard part of a car problem usually isn't the repair. It's finding a shop that tells you what is actually wrong instead of what is easiest to sell. Automotive Solutions has been answering that question for Elk Grove drivers since 2001.</p><p>We work on all makes and models, domestic and import. Our technicians are ASE certified, we use current diagnostic equipment and quality parts, and as a NAPA AutoCare Center our qualifying repairs carry a warranty that follows you out of town.</p>
        <h2>What this service covers</h2>
        <ul class="checklist"><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Computerized diagnostics and drivability troubleshooting</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Engine repair, replacement and major overhaul</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Transmission service, repair and replacement</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Brake systems — pads, rotors, calipers, hydraulics and ABS faults</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Suspension and steering, including shocks and struts</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Air conditioning and heating service</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Electrical faults, batteries, alternators and starters</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Timing belts, belts, hoses and cooling systems</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Fuel injection service and tune-ups</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Factory-scheduled maintenance and oil changes</span></li></ul>
        <h2 style="margin-top:1.8em">Signs it's time to call us</h2>
        <ul><li>A warning light you have been driving with for weeks</li><li>A noise, vibration or smell that started recently and has not gone away</li><li>A dealership quote that feels far higher than the problem sounds</li><li>Another shop replaced a part and the symptom is still there</li><li>The car is due for major-mileage service and you want an honest scope</li><li>You just bought a used car and want a baseline inspection</li></ul>
        <p>If any of these sound like your vehicle, call <a href="tel:+19166865277"
        data-loc="service-body">(916) 686-5277</a>. We will tell you what we think it is,
        what it takes to know for certain, and what that costs — before you commit to anything.</p>
        <h2 style="margin-top:1.8em">Serving Elk Grove and south Sacramento County</h2>
        <p>Automotive Solutions is at 9253 Elk Grove Blvd, Elk Grove, CA 95624, in Old Town Elk Grove just east of
        Highway 99. We handle auto repair for drivers across
        Elk Grove, Laguna, Sacramento, Wilton, Galt, Florin, Vineyard, Sheldon, Franklin and Rancho Cordova.</p>

      <div>
        <p>Belts and hoses are the least glamorous parts on the car and among the most consequential. A ten-dollar hose that lets go on Highway 99 in July can cost you a head gasket before you reach the shoulder.</p><p>Valley heat is hard on rubber. We inspect belts and hoses as a matter of course, and we will tell you honestly whether something is worn, aging or still fine — with the reasoning, so it is your call.</p>
        <h2>What this service covers</h2>
        <ul class="checklist"><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Serpentine and accessory drive belt replacement</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Radiator, heater and coolant hose replacement</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Tensioner, idler and pulley service</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Radiator, water pump and thermostat replacement</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Cooling system pressure testing and leak detection</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Coolant flush and refill to specification</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Overheating diagnosis, including fans and fan clutches</span></li></ul>
        <h2 style="margin-top:1.8em">Signs it's time to call us</h2>
        <ul><li>Squealing or chirping from the engine bay, especially on startup</li><li>Temperature gauge climbing in traffic or on a hot day</li><li>Sweet smell, or green, orange or pink puddles under the car</li><li>Coolant level that keeps dropping with no visible leak</li><li>Visible cracks, glazing or missing ribs on a belt</li><li>The heater blows cold when the engine is warm</li></ul>
        <p>If any of these sound like your vehicle, call <a href="tel:+19166865277"

        <p>A trouble code tells you which circuit reported a problem. It does not tell you which part failed. That gap is why drivers end up paying for a sensor, a coil and a catalytic converter for one fault that turned out to be a vacuum leak.</p><p>Our diagnostic process starts with the code, then verifies it with live data, testing and inspection until we can point at the actual failure — using up-to-date diagnostic equipment and technicians who know how to read it.</p>
        <h2>What this service covers</h2>
        <ul class="checklist"><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Full OBD-II code scan with freeze-frame and live data review</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Drivability diagnosis — misfires, hesitation, stalling, rough idle</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Electrical and parasitic draw testing</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Emissions-related fault diagnosis and smog-failure follow-up</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Noise, vibration and harshness road-test diagnosis</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Second opinions on another shop's diagnosis or a dealer estimate</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>A plain-language explanation of what failed and why</span></li></ul>

<section>

      <div>
        <p>Electrical faults are where guesswork gets expensive fastest. A no-start can be a battery, a cable, a starter, a relay, a security system or a bad ground — and every one of them looks identical from the driver's seat.</p><p>We test the circuit instead of replacing parts in order of price. That is how you end up paying for the one component that actually failed.</p>
        <h2>What this service covers</h2>
        <ul class="checklist"><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Battery, starter and alternator testing and replacement</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>No-start and intermittent-start diagnosis</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Parasitic draw testing for batteries that die overnight</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Charging system and voltage drop testing</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Wiring, connector, ground and fuse repair</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Lighting, power window, door lock and accessory faults</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Warning lights traced to an electrical cause</span></li></ul>
        <h2 style="margin-top:1.8em">Signs it's time to call us</h2>
        <ul><li>The car is dead in the morning but fine after a jump</li><li>Clicking when you turn the key, or a slow lazy crank</li><li>Battery or charging warning light on the dash</li><li>Headlights dim at idle and brighten when you rev</li><li>Power windows, locks or accessories working intermittently</li><li>You already replaced the battery and it happened again</li></ul>
        <p>If any of these sound like your vehicle, call <a href="tel:+19166865277"
        data-loc="service-body">(916) 686-5277</a>. We will tell you what we think it is,
        what it takes to know for certain, and what that costs — before you commit to anything.</p>
        <h2 style="margin-top:1.8em">Serving Elk Grove and south Sacramento County</h2>
        <p>Automotive Solutions is at 9253 Elk Grove Blvd, Elk Grove, CA 95624, in Old Town Elk Grove just east of

        Elk Grove, Laguna, Sacramento, Wilton, Galt, Florin, Vineyard, Sheldon, Franklin and Rancho Cordova.</p>

<section class="bg-alt"><div class="wrap">

  <div class="faq"><details><summary>My battery is new and the car died again. What now?</summary><div class="answer"><p>That usually points at the charging system or a parasitic draw — something staying awake after you lock the car. Both are testable, and we test them.</p></div></details><details><summary>How do I know if it is the battery or the alternator?</summary><div class="answer"><p>Both leave you stranded and the symptoms overlap. A proper test of the battery, starter draw and charging output tells you in minutes which one it is.</p></div></details><details><summary>Do you fix wiring problems, not just replace parts?</summary><div class="answer"><p>Yes. Wiring, grounds, connectors and fuses are traced and repaired — that is often the actual fault behind a part that keeps failing.</p></div></details></div>

<section>
  <div class="wrap">
    <div class="split">
      <div>
        <p>Engine work gets expensive when it is diagnosed by assumption. Before we quote, we establish what is actually failing — compression, ignition, fuel, cooling or mechanical — and we tell you what the repair is worth relative to the vehicle.</p><p>Engine replacement and major overhaul are both everyday work here. So is telling somebody the money is better spent elsewhere. You will get that conversation either way, before anything is taken apart.</p>
        <h2>What this service covers</h2>
        <ul class="checklist"><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Misfire, rough-idle and low-power diagnosis</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Compression and cylinder leak-down testing</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Major overhaul and internal engine work</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Engine replacement when it is the right economic call</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Head gasket and cooling-system repair</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Oil leak diagnosis and gasket or seal replacement</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Overheating diagnosis — water pumps, thermostats, radiators, fans</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Belts, hoses, tensioners and pulleys</span></li></ul>
        <h2 style="margin-top:1.8em">Signs it's time to call us</h2>
        <ul><li>Ticking, knocking or tapping that changes with engine speed</li><li>Temperature gauge climbing, or coolant disappearing</li><li>Blue, white or black smoke from the exhaust</li><li>Oil spots on the driveway or a burning-oil smell</li><li>The engine shakes at idle, or the check engine light is flashing</li><li>Power loss on hills or when the vehicle is loaded</li></ul>
        <p>If any of these sound like your vehicle, call <a href="tel:+19166865277"
        data-loc="service-body">(916) 686-5277</a>. We will tell you what we think it is,
        what it takes to know for certain, and what that costs — before you commit to anything.</p>
        <h2 style="margin-top:1.8em">Serving Elk Grove and south Sacramento County</h2>
        <p>Automotive Solutions is at 9253 Elk Grove Blvd, Elk Grove, CA 95624, in Old Town Elk Grove just east of
        Highway 99. We handle engine repair for drivers across
        Elk Grove, Laguna, Sacramento, Wilton, Galt, Florin, Vineyard, Sheldon, Franklin and Rancho Cordova.</p>

      <div>
        <p>Worn suspension rarely announces itself. It shows up as a car that wanders on the freeway, a clunk over a railroad crossing, or tires that wore out thousands of miles early — and it quietly increases how far you need to stop.</p><p>We inspect the whole corner rather than replacing the part that is easiest to reach, then show you what is actually worn and what it is costing you in tires and stopping distance.</p>
        <h2>What this service covers</h2>
        <ul class="checklist"><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Shock and strut inspection and replacement</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Ball joint, tie rod and control arm service</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Bushing, sway bar and link replacement</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Steering rack, pump and linkage diagnosis</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Wheel bearing and hub service</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Alignment-related wear diagnosis</span></li></ul>
        <h2 style="margin-top:1.8em">Signs it's time to call us</h2>
        <ul><li>A clunk or rattle over bumps and dips</li><li>The vehicle wanders, or you are always correcting the wheel</li><li>It pulls to one side on a flat road</li><li>The front end dives hard when braking, or the ride feels floaty</li><li>Uneven or cupped tire wear</li><li>Steering feels loose, heavy or notchy</li></ul>
        <p>If any of these sound like your vehicle, call <a href="tel:+19166865277"
        data-loc="service-body">(916) 686-5277</a>. We will tell you what we think it is,
        what it takes to know for certain, and what that costs — before you commit to anything.</p>

        Highway 99. We handle shocks, struts &amp; suspension for drivers across
        Elk Grove, Laguna, Sacramento, Wilton, Galt, Florin, Vineyard, Sheldon, Franklin and Rancho Cordova.</p>

<section>
  <div class="wrap">
    <div class="split">
      <div>
        <p>A timing belt is the cheapest expensive job on your car. Replaced on schedule it is a planned maintenance item. Snapped on an interference engine, it can bend valves and turn into an engine rebuild in a single second.</p><p>Timing belts are listed work at this shop and have been for years. We do them with the water pump, tensioner and idlers where the design calls for it — because those parts sit behind the same cover, and doing them separately means paying that labor twice.</p>
        <h2>What this service covers</h2>
        <ul class="checklist"><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Timing belt replacement to manufacturer interval</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Water pump, tensioner and idler pulley replacement at the same time</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Timing chain, guide and tensioner service</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Cam and crank seal replacement while access is open</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Drive belt, pulley and accessory inspection</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Timing-related fault diagnosis after a no-start</span></li></ul>
        <h2 style="margin-top:1.8em">Signs it's time to call us</h2>
        <ul><li>You are at or past the mileage in the maintenance schedule</li><li>You bought the car used with no record of the belt being done</li><li>A rattle, slap or whine from the front of the engine</li><li>The engine cranks but will not start</li><li>Rough running or a timing-related trouble code</li><li>Coolant seeping from behind the timing cover</li></ul>
        <p>If any of these sound like your vehicle, call <a href="tel:+19166865277"
        data-loc="service-body">(916) 686-5277</a>. We will tell you what we think it is,
        what it takes to know for certain, and what that costs — before you commit to anything.</p>
        <h2 style="margin-top:1.8em">Serving Elk Grove and south Sacramento County</h2>
        <p>Automotive Solutions is at 9253 Elk Grove Blvd, Elk Grove, CA 95624, in Old Town Elk Grove just east of
        Highway 99. We handle timing belts for drivers across
        Elk Grove, Laguna, Sacramento, Wilton, Galt, Florin, Vineyard, Sheldon, Franklin and Rancho Cordova.</p>

<section class="bg-alt"><div class="wrap">
  <div class="sec-head"><span class="eyebrow">Questions</span><h2>Timing Belts — questions we get asked</h2></div>
  <div class="faq"><details><summary>When does a timing belt need replacing?</summary><div class="answer"><p>It is a mileage-based service and the interval is set by your manufacturer — it varies a lot between vehicles. Tell us your year, make and model and we will look up the interval that applies to yours.</p></div></details><details><summary>Should the water pump be replaced at the same time?</summary><div class="answer"><p>On most belt-driven engines, yes. The pump sits behind the same cover, so replacing it later means paying for the same labor a second time.</p></div></details><details><summary>Does my car have a belt or a chain?</summary><div class="answer"><p>It depends on the engine, and some vehicles use both. Call (916) 686-5277 with your year, make and model and we will tell you which one you have and whether it is a service item.</p></div></details></div>

        <p>Not every shifting complaint is a transmission rebuild. Low fluid, a failing solenoid, a bad sensor, a worn mount or an engine misfire can all feel identical from the driver's seat — and they are separated by thousands of dollars.</p><p>So we diagnose before we quote. If it turns out you do need a replacement, we will tell you plainly and price it before anything comes apart.</p>
        <h2>What this service covers</h2>
        <ul class="checklist"><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Transmission diagnosis with scan-tool and road-test verification</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Fluid and filter service to manufacturer specification</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Solenoid, sensor and valve-body related repairs</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Transmission replacement</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Clutch service for manual transmissions</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Axle, CV joint and driveline repair</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Transmission cooler and leak repair</span></li></ul>
        <h2 style="margin-top:1.8em">Signs it's time to call us</h2>
        <ul><li>Slipping — the engine revs but the vehicle does not accelerate</li><li>Hard, delayed or clunking shifts</li><li>The vehicle hesitates before engaging drive or reverse</li><li>Red or brown fluid on the ground under the middle of the car</li><li>A whine or hum that changes with road speed</li><li>Check engine light with a transmission-related code</li></ul>
        <p>If any of these sound like your vehicle, call <a href="tel:+19166865277"

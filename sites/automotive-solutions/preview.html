<section>
  <div class="wrap">
    <div class="split">
      <div>
        <p>A vibration at freeway speed is usually a balance problem. Usually — but not always. It can also be a bent wheel, a separated tire, a worn hub bearing or a suspension component that is letting the wheel move where it should not.</p><p>So we balance the wheels and then look at why they went out. Tires are the only part of the car that touches the road, and the wear pattern on them is one of the most honest diagnostic reports you can read.</p>
        <h2>What this service covers</h2>
        <ul class="checklist"><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Wheel balancing, front, rear or all four</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Tire rotation on schedule</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Tread depth and wear-pattern inspection</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Vibration diagnosis — wheels, tires, hubs and driveline</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Wear diagnosis, identifying the suspension or alignment cause</span></li><li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Valve stems, pressure setting and load-appropriate inflation</span></li></ul>
        <h2 style="margin-top:1.8em">Signs it's time to call us</h2>
        <ul><li>Vibration in the steering wheel or seat at freeway speed</li><li>Uneven wear — one edge, the center, or scalloped patches</li><li>A tire that keeps going low</li><li>The vehicle pulls to one side on a flat road</li><li>A hum or roar that changes with road speed</li><li>It has been a long time since the tires were rotated</li></ul>
        <p>If any of these sound like your vehicle, call <a href="tel:+19166865277"
        data-loc="service-body">(916) 686-5277</a>. We will tell you what we think it is,
        what it takes to know for certain, and what that costs — before you commit to anything.</p>
        <h2 style="margin-top:1.8em">Serving Elk Grove and south Sacramento County</h2>
        <p>Automotive Solutions is at 9253 Elk Grove Blvd, Elk Grove, CA 95624, in Old Town Elk Grove just east of
        Highway 99. We handle wheel balance &amp; tires for drivers across
        Elk Grove, Laguna, Sacramento, Wilton, Galt, Florin, Vineyard, Sheldon, Franklin and Rancho Cordova.</p>

  <div class="sec-head"><span class="eyebrow">Questions</span><h2>Wheel Balance &amp; Tires — questions we get asked</h2></div>
  <div class="faq"><details><summary>How often should tires be rotated and balanced?</summary><div class="answer"><p>Most vehicles do well rotated at every oil change. Balancing is worth checking whenever a vibration appears or a tire is removed. We check wear patterns each time so the rotation is actually solving something.</p></div></details><details><summary>My car still vibrates after a balance somewhere else. Why?</summary><div class="answer"><p>Because balancing fixes an imbalance, and not every vibration is one. A bent wheel, a tire with a separated belt, a worn hub bearing or a suspension fault will all survive a perfect balance. We look for those.</p></div></details><details><summary>Can uneven tire wear be fixed?</summary><div class="answer"><p>The wear cannot be undone, but the cause can be. Uneven wear is a symptom — usually alignment, suspension wear or long-term underinflation — and worth fixing before you buy the next set.</p></div></details></div>
</div></section>

  var SITE_JS = "/* Automotive Solutions by Single \u2014 minimal progressive-enhancement JS.\n   No libraries, no trackers loaded from anywhere. Everything degrades:\n   with JS off the nav links still work and the form still posts normally. */\n(function () {\n  \"use strict\";\n\n  var PHONE = \"(916) 686-5277\";\n\n  /* --- Mobile navigation --- */\n  var toggle = document.querySelector(\".nav-toggle\");\n  var nav = document.getElementById(\"primary-nav\");\n  if (toggle && nav) {\n    toggle.addEventListener(\"click\", function () {\n      var open = nav.classList.toggle(\"open\");\n      toggle.setAttribute(\"aria-expanded\", open ? \"true\" : \"false\");\n    });\n    nav.addEventListener(\"click\", function (e) {\n      if (e.target.tagName === \"A\") {\n        nav.classList.remove(\"open\");\n        toggle.setAttribute(\"aria-expanded\", \"false\");\n      }\n    });\n    document.addEventListener(\"keydown\", function (e) {\n      if (e.key === \"Escape\" && nav.classList.contains(\"open\")) {\n        nav.classList.remove(\"open\");\n        toggle.setAttribute(\"aria-expanded\", \"false\");\n        toggle.focus();\n      }\n    });\n  }\n\n  /* --- Current year in footer --- */\n  var y = document.querySelectorAll(\"[data-year]\");\n  for (var i = 0; i < y.length; i++) { y[i].textContent = new Date().getFullYear(); }\n\n  /* --- Conversion tracking hooks -------------------------------------\n     Pushes a dataLayer event (and a gtag event, if gtag is present) on\n     calls, directions and form submits, so the shop can count leads in\n     GA4 or Google Ads later without anyone editing the markup. Nothing\n     is loaded from a third party here \u2014 if no analytics tag is installed\n     the events simply queue on window.dataLayer and go nowhere. */\n  function track(name, params) {\n    window.dataLayer = window.dataLayer || [];\n    var payload = { event: name };\n    for (var k in (params || {})) { if (params.hasOwnProperty(k)) payload[k] = params[k]; }\n    window.dataLayer.push(payload);\n    if (typeof window.gtag === \"function\") { window.gtag(\"event\", name, params || {}); }\n  }\n\n  document.addEventListener(\"click\", function (e) {\n    var a = e.target.closest && e.target.closest(\"a\");\n    if (!a) return;\n    var href = a.getAttribute(\"href\") || \"\";\n    if (href.indexOf(\"tel:\") === 0) {\n      track(\"click_to_call\", { link_location: a.getAttribute(\"data-loc\") || \"page\" });\n    } else if (href.indexOf(\"google.com/maps\") > -1 || href.indexOf(\"maps.google\") > -1) {\n      track(\"get_directions\", { link_location: a.getAttribute(\"data-loc\") || \"page\" });\n    }\n  });\n\n  /* --- Quote form ---------------------------------------------------\n     Posts to the endpoint in the form's action attribute (FormSubmit by\n     default). If the endpoint still holds the placeholder address, it\n     degrades to a prefilled mailto: so a lead is never silently dropped. */\n  var forms = document.querySelectorAll(\"form[data-quote-form]\");\n  Array.prototype.forEach.call(forms, function (form) {\n    var status = form.querySelector(\".form-status\");\n    var es = document.documentElement.lang === \"es\";\n\n    function say(msg, kind) {\n      if (!status) { window.alert(msg); return; }\n      status.textContent = msg;\n      status.className = \"form-status show \" + kind;\n    }\n\n    form.addEventListener(\"submit\", function (e) {\n      /* Honeypots: real people never fill these, bots usually do. */\n      var hp1 = form.querySelector('input[name=\"_gotcha\"]');\n      var hp2 = form.querySelector('input[name=\"_honey\"]');\n      if ((hp1 && hp1.value) || (hp2 && hp2.value)) { e.preventDefault(); return; }\n\n      var action = form.getAttribute(\"action\") || \"\";\n      /* The build ships with a placeholder address until the shop's real\n         inbox is filled in (SITE[\"email\"] in build.py). Until then the form\n         must not pretend to have sent anything. */\n      var placeholder = action.indexOf(\"REPLACE-ME\") > -1 || action.indexOf(\"example.com\") > -1;\n\n      if (placeholder) {\n        e.preventDefault();\n        say(es\n          ? \"Este formulario a\u00fan no est\u00e1 conectado. Por favor llame al \" + PHONE + \" \u2014 con gusto le atendemos.\"\n          : \"This form isn't connected to an inbox yet. Please call \" + PHONE + \" \u2014 we'll take care of you.\",\n          \"err\");\n        return;\n      }\n\n      e.preventDefault();\n      var btn = form.querySelector('button[type=\"submit\"]');\n      if (btn) { btn.disabled = true; btn.setAttribute(\"data-label\", btn.textContent); btn.textContent = es ? \"Enviando\u2026\" : \"Sending\u2026\"; }\n\n      fetch(action, {\n        method: \"POST\",\n        body: new FormData(form),\n        headers: { Accept: \"application/json\" }\n      }).then(function (res) {\n        if (!res.ok) throw new Error(\"bad status\");\n        form.reset();\n        say(es\n          ? \"Gracias \u2014 ya lo recibimos. Le llamamos con los siguientes pasos. \u00bfEs urgente? Llame al \" + PHONE + \".\"\n          : \"Thanks \u2014 we got it. We'll call you back with next steps. Need us sooner? Call \" + PHONE + \".\", \"ok\");\n        track(\"generate_lead\", { form_id: form.id || \"quote\" });\n      }).catch(function () {\n        say(es\n          ? \"No se pudo enviar. Por favor llame al \" + PHONE + \" y con gusto le atendemos.\"\n          : \"That didn't go through. Please call \" + PHONE + \" and we'll take care of you.\", \"err\");\n      }).then(function () {\n        if (btn) { btn.disabled = false; btn.textContent = btn.getAttribute(\"data-label\") || (es ? \"Enviar solicitud\" : \"Send request\"); }\n      });\n    });\n  });\n})();\n";

  var app = document.getElementById("app");
  var views = {};
  Array.prototype.forEach.call(document.querySelectorAll("template[data-route]"), function (t) {
    views[t.getAttribute("data-route")] = t.innerHTML;
  });

  function routeFor(href) {
    var path = href.split("#")[0].split("?")[0];
    if (!path) return "/";
    if (views[path]) return path;
    if (views[path + "/"]) return path + "/";
    return "/404/";
  }

  function render(path, anchor) {
    app.innerHTML = views[path] || views["/404/"];
    /* one shared copy of each image, applied after the markup lands */
    Array.prototype.forEach.call(app.querySelectorAll("[data-src]"), function (el) {
      var k = el.getAttribute("data-src");
      if (ASSETS[k]) { el.setAttribute("src", ASSETS[k]); el.removeAttribute("data-src"); }
    });
    document.documentElement.lang = (path === "/es/") ? "es" : "en";
    try { new Function(SITE_JS)(); } catch (e) {}
    previewForms();
    var target = anchor && document.getElementById(anchor.replace(/^#/, ""));
    if (target) { target.scrollIntoView(); } else { window.scrollTo(0, 0); }
  }

  /* On the live site the form posts to FormSubmit. That cannot work from a
     single offline file, so say so plainly rather than failing quietly. */
  function previewForms() {
    Array.prototype.forEach.call(document.querySelectorAll("form[data-quote-form]"), function (form) {
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        e.stopImmediatePropagation();
        var es = document.documentElement.lang === "es";
        var status = form.querySelector(".form-status");
        if (status) {
          status.textContent = es
            ? "Vista previa — en el sitio real esta solicitud llega directo al taller."
            : "Preview only — on the live site this request goes straight to the shop.";
          status.className = "form-status show ok";
        }
      }, true);
    });
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a");
    if (!a) return;
    var href = a.getAttribute("href") || "";
    if (href.charAt(0) === "#") {
      var el = document.getElementById(href.slice(1));
      if (el) { e.preventDefault(); el.scrollIntoView({behavior: "smooth"}); }
      return;
    }
    if (href.charAt(0) !== "/") return;      /* tel:, mailto: and external links stay real */
    e.preventDefault();
    var hash = href.split("#")[1];
    window.location.hash = "#" + routeFor(href) + (hash ? "#" + hash : "");
  });

  function fromHash() {
    var raw = (window.location.hash || "").replace(/^#/, "");
    var parts = raw.split("#");
    var path = parts[0] || "/";
    render(views[path] ? path : routeFor(path), parts[1] || null);
  }

  window.addEventListener("hashchange", fromHash);
  fromHash();
})();
</script>

# Netlify: set the base directory to this folder in the UI, or deploy from the
# repo root with the base below.
[build]
  base    = "sites/cali-tints"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# _headers and _redirects in public/ are copied into dist/ and picked up
# automatically; they are the source of truth rather than this file.

# Serverless functions: the site assistant (/.netlify/functions/chat) and the
# Instagram / Messenger webhook (/.netlify/functions/meta-webhook). They only
# answer with Claude when ANTHROPIC_API_KEY is set in the Netlify UI; without
# it the site falls back to the built-in guided assistant.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

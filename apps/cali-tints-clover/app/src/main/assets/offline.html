<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No connection</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d0f; color: #e9eef5; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 32px 24px; text-align: center; box-sizing: border-box; }
  h1 { font-size: 22px; margin: 0; }
  p { margin: 0; color: #aab3bf; max-width: 32ch; }
  a { display: inline-block; margin-top: 8px; padding: 12px 22px; border-radius: 12px; background: #82d955; color: #0b0d0f; font-weight: 600; text-decoration: none; }
  .mark { width: 72px; height: 72px; border-radius: 20px; background: #15181c; display: grid; place-items: center; color: #82d955; font-weight: 800; font-size: 26px; letter-spacing: .04em; }
</style>
</head>
<body>
<main>
  <div class="mark">CT</div>
  <h1>No connection</h1>
  <p>Cali Tints needs Wi-Fi or data to open. Jobs you already saved are kept on this device and send themselves when the signal is back.</p>
  <a href="__APP_URL__">Try again</a>
</main>
</body>
</html>

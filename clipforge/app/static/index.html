<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipForge</title>
<style>
  :root{
    --bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--text:#e6e8ee;--muted:#8b93a7;
    --accent:#6ee7b7;--accent2:#60a5fa;--warn:#fbbf24;--bad:#f87171;--radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:18px;letter-spacing:.3px}
  .pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
  .pill.ok{color:var(--accent);border-color:#2b5b4a}
  .pill.bad{color:var(--bad);border-color:#6b2f2f}
  main{display:grid;grid-template-columns:360px 1fr;gap:16px;padding:16px 20px;max-width:1700px;margin:0 auto}
  @media (max-width:980px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .card h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input[type=text],input[type=url],input[type=number],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit}
  textarea{min-height:110px;resize:vertical;line-height:1.4}
  input[type=file]{width:100%;color:var(--muted);font-size:12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
  .chk input{accent-color:var(--accent)}
  button{background:var(--accent);color:#06281c;border:0;border-radius:8px;padding:9px 13px;font:inherit;font-weight:600;cursor:pointer}
  button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:500}
  button.small{padding:5px 9px;font-size:12px}
  button.danger{background:transparent;color:var(--bad);border:1px solid #5a2b2b}
  button:disabled{opacity:.5;cursor:not-allowed}
  a.btn{display:inline-block;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;text-decoration:none}
  a.btn.primary{background:var(--accent);color:#06281c;border-color:var(--accent);font-weight:600}
  .jobs{display:flex;flex-direction:column;gap:8px;margin-top:8px;max-height:50vh;overflow:auto}
  .job{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
  .job.active{border-color:var(--accent2)}
  .job .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .job .s{font-size:12px;color:var(--muted)}
  .status{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);height:fit-content;white-space:nowrap}
  .status.running,.status.rendering{color:var(--accent2);border-color:#2d4a73}
  .status.done{color:var(--accent);border-color:#2b5b4a}
  .status.failed{color:var(--bad);border-color:#6b2f2f}
  .status.queued,.status.pending{color:var(--warn);border-color:#6b5a1f}
  .bar{grid-column:1/-1;height:4px;background:#0b0d12;border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent2);transition:width .4s}
  .detail-empty{color:var(--muted);padding:40px;text-align:center}
  .kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
  .kv b{color:var(--muted);font-weight:500}
  video.src{width:100%;max-height:300px;background:#000;border-radius:8px;margin-top:10px}
  pre.err{white-space:pre-wrap;color:var(--bad);background:#1a1212;border:1px solid #4a2626;border-radius:8px;padding:10px;font-size:12px}
  .muted{color:var(--muted)}
  .toast{position:fixed;bottom:16px;right:16px;background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:8px;max-width:420px;display:none;z-index:9}
  .toast.bad{border-color:#6b2f2f;color:var(--bad)}
  .section{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
  .section h3{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  .clips{display:flex;flex-direction:column;gap:14px}
  .clip{display:grid;grid-template-columns:230px 1fr;gap:16px}
  @media (max-width:1200px){.clip{grid-template-columns:1fr}}
  .clip .player{position:relative}
  .clip video.v{width:230px;aspect-ratio:9/16;background:#000;border-radius:8px;display:block}
  .clip img.cover{width:230px;aspect-ratio:9/16;object-fit:cover;border-radius:8px;display:block;border:1px solid var(--line)}
  .clip .score{font-size:24px;font-weight:700;color:var(--accent)}
  .clip .score small{font-size:12px;color:var(--muted);font-weight:500}
  .clip .hook{color:var(--accent2);font-style:italic}
  .clip .tx{font-size:12.5px;line-height:1.4;margin:6px 0;color:var(--muted);max-height:64px;overflow:auto}
  .fbar{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;margin:3px 0;font-size:11px;color:var(--muted)}
  .fbar i{display:block;height:6px;background:#0b0d12;border-radius:3px;overflow:hidden}
  .fbar b{display:block;height:100%;background:var(--accent2)}
  .tabs{display:flex;gap:4px;margin:10px 0 8px;flex-wrap:wrap}
  .tab{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;font-weight:500}
  .tab.active{background:var(--panel2);color:var(--text);border-color:var(--accent2)}
  .tab.unfit{border-color:#6b5a1f}
  .copybox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
  .copybox .meta{font-size:12px;color:var(--muted);margin-bottom:6px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .tag{font-size:12px;color:var(--accent2);background:#162236;border-radius:999px;padding:2px 8px}
  .warn{color:var(--warn);font-size:12px}
  .fb button.on{background:var(--accent);color:#06281c}
  .spec{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}
  .chk2{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .chk2.ok{color:var(--accent);border-color:#2b5b4a}
  .chk2.bad{color:var(--bad);border-color:#6b2f2f}
  details summary{cursor:pointer;color:var(--muted);font-size:12px}
  .trim{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:end;margin-top:8px}
  .trim input{padding:5px 8px}
  main, section, .card, .clip > div, .copybox, .kv > span{min-width:0}
  .kv > span{overflow-wrap:anywhere}
  .row > *{max-width:100%}
  @media (max-width:640px){
    header{flex-wrap:wrap;gap:8px;padding:10px 16px}
    main{padding:12px 16px;gap:12px}
    .kv{grid-template-columns:1fr;gap:2px 0}
    .kv b{margin-top:8px}
    .kv .row input, .kv .row select{width:100% !important;flex:1 1 100%}
    .clip{grid-template-columns:1fr}
    .clip video.v, .clip img.cover{width:100%;max-height:70vh;aspect-ratio:9/16;object-fit:contain}
    .clip .player > div[style]{width:100% !important}
    .job{grid-template-columns:1fr}
    .score{font-size:20px}
  }
</style>
</head>
<body>
<header>
  <h1>ClipForge</h1>
  <span id="hp-ffmpeg" class="pill">ffmpeg: …</span>
  <span id="hp-whisper" class="pill">whisper: …</span>
  <span id="hp-llm" class="pill">LLM: …</span>
  <span id="hp-fb" class="pill" title="Learned scoring weights from your thumbs up/down">feedback: …</span>
  <span id="hp-pb" class="pill" title="Date of the platform playbook and niche data in config/">playbook …</span>
  <span style="flex:1"></span>
  <button class="secondary small" id="btn-reset-fb" title="Forget learned scoring weights">Reset learning</button>
  <button class="secondary small" id="btn-cleanup" title="Delete jobs older than the configured retention">Clean up old jobs</button>
</header>

<main>
  <section>
    <div class="card">
      <h2>New job</h2>
      <form id="job-form">
        <label for="url">Video URL (YouTube, Vimeo, Twitch VOD, direct link…)</label>
        <input id="url" name="url" type="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off">
        <label for="file">…or upload a file</label>
        <input id="file" name="file" type="file" accept="video/*,audio/*,.mkv,.mov,.mp4,.webm,.m4a,.mp3,.wav">
        <label for="hint">What is this video about, and who is it for? (optional, steers titles and captions)</label>
        <input id="hint" type="text" placeholder="e.g. eBay reselling tips for beginners who have a day job" maxlength="200">
        <label>Platforms</label>
        <div class="row" id="platforms"></div>
        <div class="grid2">
          <div><label for="max-clips">Max clips</label>
            <select id="max-clips"><option>3</option><option>5</option><option selected>8</option><option>12</option></select></div>
          <div><label for="reframe">Framing</label>
            <select id="reframe"><option value="auto" selected>Auto (face-centred)</option><option value="center">Centre crop</option><option value="blur">Full frame + blur</option></select></div>
          <div><label for="whisper">Speech model</label>
            <select id="whisper"><option value="">default</option><option>tiny</option><option>base</option><option>small</option><option>medium</option><option>large-v3</option></select></div>
          <div><label for="lang">Language (blank = auto)</label><input id="lang" type="text" placeholder="en" maxlength="5"></div>
        </div>
        <div class="row" style="margin-top:14px">
          <button type="submit" id="btn-submit">Create job</button>
          <span class="muted" id="submit-note"></span>
        </div>
      </form>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>Jobs</h2>
      <div class="jobs" id="jobs"></div>
    </div>
  </section>

  <section>
    <div class="card" id="detail">
      <div class="detail-empty">Select a job to see its source, clips, copy, and schedule.</div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const state = { jobs: [], selected: null, config: null, timer: null, tab: {}, detailJob: null };

function toast(msg, bad=false){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (bad?' bad':''); t.style.display='block';
  clearTimeout(t._h); t._h = setTimeout(()=> t.style.display='none', 5000);
}
async function api(path, opts={}){
  const r = await fetch(path, opts);
  const ct = r.headers.get('content-type')||'';
  const body = ct.includes('json') ? await r.json() : await r.text();
  if(!r.ok){ throw new Error(body.detail?.[0]?.msg || body.detail || body.error || (typeof body==='string'?body:JSON.stringify(body))); }
  return body;
}
const jsonPost = (path, data, method='POST') => api(path, {method, headers:{'content-type':'application/json'}, body: JSON.stringify(data)});
const fmtTime = s => { s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60; return `${m}:${String(r).padStart(2,'0')}`; };
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label = p => state.config?.platforms?.platforms?.[p]?.label || p;
async function clip(text){ try{ await navigator.clipboard.writeText(text); toast('Copied'); }catch(e){ toast('Clipboard blocked by browser', true); } }

async function loadHealth(){
  try{
    const h = await api('/api/health');
    $('#hp-ffmpeg').textContent = 'ffmpeg ' + (h.ffmpeg.version||'missing'); $('#hp-ffmpeg').className='pill '+(h.ok?'ok':'bad');
    $('#hp-whisper').textContent = 'whisper ' + (h.whisper_available ? h.whisper_model : 'unavailable'); $('#hp-whisper').className='pill '+(h.whisper_available?'ok':'bad');
    $('#hp-llm').textContent = h.llm_enabled ? 'LLM ' + h.llm_model : 'LLM off (heuristics)'; $('#hp-llm').className='pill '+(h.llm_enabled?'ok':'');
    const w = await api('/api/feedback/weights');
    if(state.config?.playbook?.as_of) $('#hp-pb').textContent = 'playbook ' + state.config.playbook.as_of;
    $('#hp-fb').textContent = w.learned ? `feedback: ${w.n_feedback} rating${w.n_feedback==1?'':'s'} learned` : 'feedback: none yet';
  }catch(e){ toast('health check failed: '+e.message, true); }
}
async function loadConfig(){
  state.config = await api('/api/config');
  const box = $('#platforms'); box.innerHTML='';
  for(const [id,p] of Object.entries(state.config.platforms.platforms)){
    const l = document.createElement('label'); l.className='chk';
    l.innerHTML = `<input type="checkbox" value="${id}" checked> ${esc(p.label)}`;
    box.appendChild(l);
  }
}
async function loadJobs(){
  state.jobs = await api('/api/jobs');
  renderJobs();
  let busy = state.jobs.some(j => j.status==='running' || j.status==='queued');
  if(state.selected && state.jobs.find(x=>x.id===state.selected)){ const j = await loadDetail(state.selected); if(j?.clips?.some(c=>c.status==='rendering')) busy = true; }
  clearTimeout(state.timer); state.timer = setTimeout(loadJobs, busy ? 1500 : 8000);
}
function renderJobs(){
  const box = $('#jobs'); box.innerHTML='';
  if(!state.jobs.length){ box.innerHTML='<div class="muted">No jobs yet.</div>'; return; }
  for(const j of state.jobs){
    const d = document.createElement('div'); d.className='job'+(j.id===state.selected?' active':'');
    const name = j.title || j.source_name || j.source_url || j.id;
    d.innerHTML = `<div class="t" title="${esc(name)}">${esc(name)}</div>
      <span class="status ${j.status}">${j.status}${j.stage && j.status==='running' ? ' · '+esc(j.stage):''}</span>
      <div class="s">${esc(j.message||'')}</div><div class="s">${new Date(j.created_at*1000).toLocaleString()}</div>
      <div class="bar"><i style="width:${Math.round((j.progress||0)*100)}%"></i></div>`;
    d.onclick = () => { state.selected = j.id; renderJobs(); loadDetail(j.id); };
    box.appendChild(d);
  }
}

function clipCard(j, c){
  const f = c.score_breakdown?.features || {};
  const bars = Object.entries(f).filter(([k])=>k!=='filler_penalty').map(([k,v]) =>
    `<div class="fbar"><span>${k.replace(/_/g,' ')}</span><i><b style="width:${Math.round(v*100)}%"></b></i></div>`).join('');
  const llm = c.score_breakdown?.llm != null ? ` · LLM ${(c.score_breakdown.llm*100).toFixed(0)}` : '';
  const files = p => `/api/jobs/${j.id}/files/${p}`;
  const platforms = Object.keys(c.copy||{}).length ? Object.keys(c.copy) : Object.keys(c.variants||{});
  const tab = state.tab[c.id] && platforms.includes(state.tab[c.id]) ? state.tab[c.id] : platforms[0];
  const cp = tab ? (c.copy||{})[tab] : null;
  const sc = tab ? (c.schedule||{})[tab] : null;
  const v = tab ? (c.variants||{})[tab] : null;           // this platform's cut
  const vid = (v && v.video_path) ? v.video_path : c.video_path;
  const cov = (v && v.cover_path) ? v.cover_path : c.cover_path;
  const srt = (v && v.captions_path) ? v.captions_path : c.captions_path;
  const vStart = v ? v.start : c.start_s, vEnd = v ? v.end : c.end_s;
  const nn = String(c.idx+1).padStart(2,'0');
  const fname = (ext) => `clip_${nn}${v && !v.shared ? '_'+tab : ''}${ext}`;
  const rf = c.score_breakdown?.render?.reframe;
  const cutLabel = {master:'same cut on every platform', trimmed:'trimmed to fit', extended:'extended to meet the minimum', hard_cut:'cut at the platform cap', too_short:'source too short'};
  let media = '';
  if(c.status==='done' && vid) media = `<video class="v" controls preload="metadata" poster="${files(cov)}" src="${files(vid)}"></video>`;
  else if(c.status==='rendering') media = `<div style="width:230px;aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;background:#000;border-radius:8px;color:var(--muted)">rendering…</div>`;
  else if(c.status==='failed') media = `<pre class="err">${esc(c.error||'render failed')}</pre>`;
  else media = `<div style="width:230px;aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;background:#000;border-radius:8px;color:var(--muted)">not rendered</div>`;
  return `<div class="card clip" data-clip="${c.id}">
    <div class="player">${media}
      <div class="muted" style="font-size:12px;margin-top:6px">${tab ? `<b>${esc(label(tab))}</b> cut · ` : ''}${fmtTime(vStart)} – ${fmtTime(vEnd)} · ${(vEnd-vStart).toFixed(1)}s${v ? ` · ${cutLabel[v.reason]||v.reason}` : ''}</div>
      ${v && v.folder ? `<div class="muted" style="font-size:11px;margin-top:2px">${v.scope==='universal' ? 'universal file (passes every platform spec)' : v.scope==='shared' ? 'shared with '+esc((v.shared_with||[]).map(label).join(', ')) : 'built for '+esc(label(tab))+' only'}${v.size_mb?` · ${v.size_mb} MB`:''}</div>`:''}
      ${v && v.spec ? `<div class="spec">${v.spec.checks.map(ch=>`<span class="chk2 ${ch.ok?'ok':'bad'}" title="${esc(ch.name)}: ${esc(String(ch.value))}${esc(ch.unit||'')} (limit ${esc(String(ch.limit))})">${ch.ok?'✓':'✗'} ${esc(ch.name)}</span>`).join('')}</div>`:''}
      <div class="row" style="margin-top:8px">
        ${c.status==='done' && vid ? `<a class="btn primary" href="${files(vid)}" download="${fname('.mp4')}">⬇ Download MP4</a>`:''}
        ${c.status==='done' && cov ? `<a class="btn" href="${files(cov)}" download="${fname('_cover.jpg')}">Cover</a>`:''}
        ${c.status==='done' && srt ? `<a class="btn" href="${files(srt)}" download="${fname('.srt')}">SRT</a>`:''}
      </div>
      <div class="row" style="margin-top:8px">
        <select class="small" data-reframe style="width:auto;padding:5px 8px;font-size:12px">
          <option value="">re-render: same framing</option><option value="auto">auto (face)</option><option value="center">centre</option><option value="blur">full + blur</option>
        </select>
        <button class="secondary small" data-act="rerender" ${c.status==='rendering'?'disabled':''}>Re-render</button>
      </div>
      <div class="trim">
        <div><label>Start (s)</label><input type="number" step="0.1" min="0" value="${c.start_s.toFixed(1)}" data-start></div>
        <div><label>End (s)</label><input type="number" step="0.1" min="0" value="${c.end_s.toFixed(1)}" data-end></div>
        <button class="secondary small" data-act="trim" ${c.status==='rendering'?'disabled':''}>Trim</button>
      </div>
      ${rf ? `<div class="muted" style="font-size:11px;margin-top:6px">framing: ${rf.mode}${rf.face?.found?` · face at ${(rf.face.cx*100).toFixed(0)}%`:''}</div>`:''}
    </div>
    <div>
      <div class="row" style="justify-content:space-between">
        <div class="row"><b>Clip ${c.idx+1}</b><span class="muted">master ${fmtTime(c.start_s)} – ${fmtTime(c.end_s)} · ${c.duration.toFixed(1)}s</span><span class="status ${c.status}">${c.status}</span></div>
        <div class="row fb">
          <span class="score">${(c.score*100).toFixed(0)}<small> / 100${llm}</small></span>
          <button class="secondary small" data-act="up" title="Good pick: teach the scorer">👍</button>
          <button class="secondary small" data-act="down" title="Bad pick: teach the scorer">👎</button>
        </div>
      </div>
      ${c.score_breakdown?.llm_hook ? `<div class="hook">“${esc(c.score_breakdown.llm_hook)}”</div>`:''}
      <div class="tx">${esc((v && v.text) || c.transcript || '(no speech detected in this range)')}</div>
      <details><summary>why this clip</summary>${bars}${c.score_breakdown?.llm_reason?`<div class="muted" style="font-size:12px;margin-top:4px">${esc(c.score_breakdown.llm_reason)}</div>`:''}</details>
      ${platforms.length ? `<div class="tabs">${platforms.map(p=>{ const pv=(c.variants||{})[p]; const fits = pv ? pv.fits : (c.copy?.[p]?.fits ?? true); return `<button class="tab ${p===tab?'active':''} ${fits?'':'unfit'}" data-tab="${p}">${esc(label(p))}${pv?` · ${Math.round(pv.duration)}s`:''}</button>`; }).join('')}</div>` : `<div class="muted" style="margin-top:8px">Platform cuts appear after the fit stage.</div>`}
      ${cp ? `<div class="copybox">
          <div class="meta">${sc ? `📅 ${esc(sc.local)} (${esc(sc.timezone)})` : 'not scheduled'} · copy by ${esc(cp.source)}${cp.fits?'':` · <span class="warn">⚠ ${esc(cp.fit_note||'does not fit')}</span>`}</div>
          ${cp.spec ? `<div class="spec">${cp.spec.checks.map(ch=>`<span class="chk2 ${ch.ok?'ok':'bad'}" title="${esc(ch.name)}: ${esc(String(ch.value))} (limit ${esc(String(ch.limit))})">${ch.ok?'✓':'✗'} ${esc(ch.name)}</span>`).join('')}</div>`:''}
          ${state.config.platforms.platforms[tab]?.title_max_chars ? `<label>Title</label><div class="row"><input type="text" data-field="title" value="${esc(cp.title)}" style="flex:1"><button class="secondary small" data-act="copytitle">Copy</button></div>`:''}
          <label>Hook / cover text</label><input type="text" data-field="hook" value="${esc(cp.hook)}">
          ${(cp.title_options||[]).length ? `<div class="muted" style="font-size:12px;margin-top:4px">Options to test: ${cp.title_options.map(t=>`<span class="tag" style="cursor:pointer" title="use this hook" data-opt="${esc(t)}">${esc(t)}</span>`).join(' ')}</div>`:''}
          <label>Caption</label><textarea data-field="caption">${esc(cp.caption)}</textarea>
          ${state.config.platforms.platforms[tab]?.title_max_chars ? `<label>Description</label><textarea data-field="description" style="min-height:70px">${esc(cp.description||'')}</textarea>`:''}
          <div class="tags">${(cp.hashtags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
          <div class="muted" style="font-size:12px">keywords: ${esc((cp.keywords||[]).join(', '))}</div>
          ${cp.rationale ? `<div class="muted" style="font-size:12px;margin-top:4px">why: ${esc(cp.rationale)}</div>`:''}
          ${v && v.cover_hook_path ? `<div class="row" style="margin-top:8px;align-items:flex-start"><img src="${files(v.cover_hook_path)}" alt="cover with hook" style="width:90px;aspect-ratio:9/16;border-radius:6px;border:1px solid var(--line)"><a class="btn" href="${files(v.cover_hook_path)}" download="${fname('_cover_hook.jpg')}">⬇ Cover with hook</a></div>`:''}
          <div class="row" style="margin-top:8px">
            <button class="small" data-act="copycaption">Copy caption</button>
            <button class="secondary small" data-act="savecopy">Save edits</button>
          </div>
        </div>`:''}
    </div>
  </div>`;
}

async function loadDetail(id){
  let j; try{ j = await api('/api/jobs/'+id); }catch(e){ return null; }
  state.detailJob = j;
  const src = j.meta?.source; const m = src?.media;
  const tr = j.meta?.transcript, an = j.meta?.analysis, sc = j.meta?.scoring, rd = j.meta?.render;
  let html = `<div class="row" style="justify-content:space-between">
      <h2 style="margin:0">${esc(j.title || j.source_name || j.source_url || j.id)}</h2>
      <div class="row">
        ${j.status==='done' && j.clips?.length ? `<a class="btn" href="/api/jobs/${j.id}/export.zip">⬇ All platforms (zip)</a>${(j.options?.platforms||[]).map(p=>`<a class="btn" href="/api/jobs/${j.id}/export.zip?platform=${p}" title="Only ${esc(label(p))} files, built to its spec">⬇ ${esc(label(p))} pack</a>`).join('')}<a class="btn" href="/api/jobs/${j.id}/schedule.ics">📅 .ics</a><a class="btn" href="/api/jobs/${j.id}/export.json" target="_blank">JSON</a>`:''}
        ${j.status!=='running' ? `<button class="secondary small" data-act="rerun">Re-run</button>`:''}
        ${j.status==='running' ? `<button class="secondary small" data-act="cancel">Cancel</button>`:''}
        <button class="danger small" data-act="delete">Delete</button>
      </div></div>
    <div class="kv" style="margin-top:10px">
      <b>Job</b><span>${j.id} · <span class="status ${j.status}">${j.status}${j.stage&&j.status==='running'?' · '+esc(j.stage):''}</span> · ${esc(j.message||'')}</span>
      <b>Source</b><span>${j.source_url ? `<a href="${esc(j.source_url)}" target="_blank" style="color:var(--accent2)">${esc(j.source_url)}</a>` : esc(j.source_name||'upload')}</span>
      ${m ? `<b>Media</b><span>${m.width}×${m.height} · ${m.fps?.toFixed?.(2)} fps · ${fmtTime(m.duration)} · ${m.video_codec}/${m.audio_codec||'no audio'} · ${(m.size_bytes/1048576).toFixed(1)} MB</span>`:''}
      ${src?.remote?.uploader ? `<b>Uploader</b><span>${esc(src.remote.uploader)}</span>`:''}
      <b>Options</b><span>${(j.options?.platforms||[]).map(label).join(', ')} · max ${j.options?.max_clips||'default'} clips · framing ${esc(j.options?.reframe||'auto')}</span>
      ${j.meta?.brief ? `<b>Subject</b><span>${esc(j.meta.brief.subject||'')} <span class="muted">· ${esc(j.meta.brief.niche_label||'')} · brief by ${esc(j.meta.brief.source||'')}${j.meta.brief.subtitles_polished?` · ${j.meta.brief.subtitles_polished} subtitle words corrected`:''}</span></span>
      <b>Audience</b><span>${esc(j.meta.brief.audience||'')}${j.meta.brief.promise?` <span class="muted">· promise: ${esc(j.meta.brief.promise)}</span>`:''}</span>
      ${j.meta.brief.trends ? `<b>Trends</b><span>${esc((j.meta.brief.trends.summary||'').slice(0,400))}${(j.meta.brief.trends.summary||'').length>400?'…':''} <span class="muted">(checked ${esc(j.meta.brief.trends.checked_at||'')}${(j.meta.brief.trends.sources||[]).length?`, ${j.meta.brief.trends.sources.length} sources`:''})</span>${(j.meta.brief.trends.hashtags||[]).length?`<div class="tags">${j.meta.brief.trends.hashtags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>`:''}</span>` : `<b>Trends</b><span class="muted">no live research (add an API key with web search on to pull current hashtags and phrasing for this niche)</span>`}
      <b>Fix brief</b><span class="row"><input type="text" id="brief-subject" placeholder="subject" value="${esc(j.meta.brief.subject||'')}" style="width:220px"><input type="text" id="brief-audience" placeholder="audience" value="${esc(j.meta.brief.audience||'')}" style="width:260px"><select id="brief-niche" style="width:auto">${Object.entries(state.config?.niches?.niches||{}).map(([k,n])=>`<option value="${k}" ${k===j.meta.brief.niche?'selected':''}>${esc(n.label)}</option>`).join('')}<option value="general" ${j.meta.brief.niche==='general'?'selected':''}>General</option></select><button class="secondary small" data-act="savebrief">Save &amp; rewrite copy</button></span>`:''}
      ${tr ? `<b>Transcript</b><span>${tr.available ? `${tr.n_words} words · ${esc(tr.language||'?')} · whisper ${esc(tr.model||'')}` : `<span class="warn">unavailable: ${esc(tr.error||'')}</span>`}</span>`:''}
      ${an ? `<b>Segments</b><span>${an.n_scenes} shots · ${an.n_sentences} sentences · ${an.n_candidates} candidates (${an.mode})</span>`:''}
      ${sc ? `<b>Scoring</b><span>${sc.llm_used ? 'heuristics + LLM' : 'heuristics only'} · ${sc.n_selected} of ${sc.n_candidates} selected${sc.keywords?.length ? ' · keywords: '+esc(sc.keywords.join(', ')):''}</span>`:''}
      ${j.meta?.fit ? `<b>Platform cuts</b><span>${j.meta.fit.n_platform_cuts} platform-specific cut${j.meta.fit.n_platform_cuts===1?'':'s'} across ${j.meta.fit.n_clips} clips (the rest share the master cut)</span>`:''}
      ${rd ? `<b>Render</b><span>${rd.n_clips - rd.n_failed} of ${rd.n_clips} clips rendered${rd.n_files?` · ${rd.n_files} file${rd.n_files===1?'':'s'}`:''}${rd.placement?` · ${rd.placement==='universal'?'one universal file per cut':'separate file per platform spec'}`:''}</span>`:''}
    </div>`;
  if(j.error) html += `<pre class="err">${esc(j.error)}</pre>`;
  if(src?.files?.video) html += `<details style="margin-top:8px"><summary>source preview</summary><video class="src" controls preload="metadata" src="/api/jobs/${j.id}/files/${src.files.video}"></video></details>`;
  html += `<div class="section"><h3>Clips</h3>`;
  if(!j.clips?.length) html += `<div class="muted">${j.status==='done' ? 'No clips were selected (source may be too short for the configured clip length).' : 'Clips appear here once the pipeline reaches the score stage.'}</div>`;
  else html += `<div class="clips">${j.clips.map(c=>clipCard(j,c)).join('')}</div>`;
  html += `</div>`;
  const box = $('#detail');
  // Preserve in-progress edits/playback: skip re-render if nothing structural changed.
  const sig = JSON.stringify([j.status, j.stage, j.message, j.progress, j.clips?.map(c=>[c.id,c.status,c.updated_at,state.tab[c.id]])]);
  if(box.dataset.sig === sig) return j;
  if(box.querySelector('textarea:focus, input:focus')) return j;  // user is typing
  box.dataset.sig = sig; box.innerHTML = html;
  box.querySelectorAll('[data-act]').forEach(b => b.onclick = () => action(j, b));
  box.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { const card=b.closest('.clip'); state.tab[card.dataset.clip]=b.dataset.tab; box.dataset.sig=''; loadDetail(j.id); });
  box.querySelectorAll('[data-opt]').forEach(t => t.onclick = () => { const card=t.closest('.clip'); const f=card.querySelector('[data-field=hook]'); if(f){ f.value=t.dataset.opt; f.focus(); } });
  return j;
}

async function action(j, btn){
  const act = btn.dataset.act;
  const card = btn.closest('.clip'); const cid = card?.dataset.clip;
  const c = cid ? j.clips.find(x=>x.id===cid) : null;
  const tab = c ? (state.tab[cid] && c.copy?.[state.tab[cid]] ? state.tab[cid] : Object.keys(c.copy||{})[0]) : null;
  try{
    if(act==='delete'){ if(!confirm('Delete this job and all its files?')) return; await api('/api/jobs/'+j.id,{method:'DELETE'}); state.selected=null; $('#detail').innerHTML='<div class="detail-empty">Job deleted.</div>'; $('#detail').dataset.sig=''; }
    else if(act==='rerun') await api(`/api/jobs/${j.id}/run`,{method:'POST'});
    else if(act==='cancel') await api(`/api/jobs/${j.id}/cancel`,{method:'POST'});
    else if(act==='up' || act==='down'){ await jsonPost(`/api/clips/${cid}/feedback`, {rating: act==='up'?1:-1}); toast(act==='up' ? 'Thanks — scorer nudged toward clips like this' : 'Noted — scorer nudged away from clips like this'); loadHealth(); }
    else if(act==='rerender'){ const rf = card.querySelector('[data-reframe]').value; await api(`/api/clips/${cid}/rerender${rf?'?reframe='+rf:''}`,{method:'POST'}); toast('Re-rendering clip '+(c.idx+1)); }
    else if(act==='trim'){ const s=parseFloat(card.querySelector('[data-start]').value), e=parseFloat(card.querySelector('[data-end]').value); await jsonPost(`/api/clips/${cid}`, {start_s:s, end_s:e}, 'PATCH'); await api(`/api/clips/${cid}/rerender`,{method:'POST'}); toast('Trimmed; re-rendering'); }
    else if(act==='copycaption') return clip(card.querySelector('[data-field=caption]').value);
    else if(act==='copytitle') return clip(card.querySelector('[data-field=title]').value);
    else if(act==='savebrief'){ await jsonPost(`/api/jobs/${j.id}/brief`, {subject: $('#brief-subject').value, audience: $('#brief-audience').value, niche: $('#brief-niche').value, rewrite_copy: true}, 'PATCH'); toast('Brief saved; copy rewritten'); }
    else if(act==='savecopy'){ const data={}; card.querySelectorAll('[data-field]').forEach(i=>data[i.dataset.field]=i.value); await jsonPost(`/api/clips/${cid}`, {copy:{[tab]:data}}, 'PATCH'); toast('Saved'); }
    $('#detail').dataset.sig=''; await loadJobs();
  }catch(e){ toast(e.message, true); }
}

$('#job-form').onsubmit = async (ev) => {
  ev.preventDefault();
  const fd = new FormData();
  const url = $('#url').value.trim(); const file = $('#file').files[0];
  if(!url && !file){ toast('Paste a URL or choose a file', true); return; }
  if(url) fd.append('url', url);
  if(file) fd.append('file', file);
  const plats = [...$('#platforms').querySelectorAll('input:checked')].map(i=>i.value);
  if(!plats.length){ toast('Pick at least one platform', true); return; }
  fd.append('platforms', plats.join(','));
  const opts = { max_clips: Number($('#max-clips').value), reframe: $('#reframe').value };
  if($('#whisper').value) opts.whisper_model = $('#whisper').value;
  if($('#hint').value.trim()) opts.brief_hint = $('#hint').value.trim();
  if($('#lang').value.trim()) opts.language = $('#lang').value.trim();
  fd.append('options', JSON.stringify(opts));
  $('#btn-submit').disabled = true; $('#submit-note').textContent = file ? 'uploading…' : 'creating…';
  try{
    const j = await api('/api/jobs', {method:'POST', body: fd});
    state.selected = j.id; $('#url').value=''; $('#file').value='';
    toast('Job created: '+j.id);
    await loadJobs();
  }catch(e){ toast(e.message, true); }
  finally{ $('#btn-submit').disabled=false; $('#submit-note').textContent=''; }
};
$('#btn-cleanup').onclick = async () => {
  try{ const r = await api('/api/cleanup',{method:'POST'}); toast(`Removed ${r.count} job(s) older than ${r.days} days`); await loadJobs(); }
  catch(e){ toast(e.message,true); }
};
$('#btn-reset-fb').onclick = async () => {
  if(!confirm('Forget all learned scoring weights?')) return;
  try{ await api('/api/feedback/reset',{method:'POST'}); toast('Learned weights reset'); loadHealth(); }catch(e){ toast(e.message,true); }
};
loadConfig().then(()=>{ loadHealth(); loadJobs(); });
</script>

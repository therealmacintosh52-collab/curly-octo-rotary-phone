<!DOCTYPE html>
<!-- Review-request card sheet (EXP-A5, T-010). Letter page, 2 x 5 cards of
     3.5 x 2 in; cut along the light dashed lines.
     {{TOKENS}} are filled by render_card.py; never by hand. The block between
     CARD markers is repeated 10 times. No web fonts, no external requests.
     The QR encodes ONLY the business's Google review link. -->
<html lang="en"><head><meta charset="utf-8">
<title>Review card sheet: {{BUSINESS}}</title>
<style>
@page { size: 8.5in 11in; margin: 0 }
* { box-sizing: border-box; margin: 0; padding: 0 }
html, body { width: 8.5in; height: 11in; background: #fff }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact;
  font-family: "Liberation Sans", Arial, Helvetica, sans-serif; color: #111 }
.sheet { position: absolute; left: 0.75in; top: 0.5in; width: 7in; height: 10in;
  display: grid; grid-template-columns: 3.5in 3.5in; grid-template-rows: repeat(5, 2in) }
.card { position: relative; width: 3.5in; height: 2in; overflow: hidden;
  outline: 0.5px dashed #c8c8c8; outline-offset: -0.25px }
.bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0.08in; background: {{ACCENT}} }
.txt { position: absolute; left: 0.22in; top: 0.17in; width: 1.68in }
.biz { font-weight: 700; font-size: 10.5pt; line-height: 1.15; color: {{ACCENT}};
  margin-bottom: 0.07in; overflow-wrap: anywhere }
.ask { font-size: 8pt; line-height: 1.3 }
.ask .u { overflow-wrap: anywhere; font-weight: 700 }
.qr { position: absolute; left: 2.05in; top: 0.15in; width: 1.3in; height: 1.3in }
.qr svg { display: block; width: 100%; height: 100% }
.link { position: absolute; left: 2.05in; top: 1.5in; width: 1.3in; font-size: 6pt;
  line-height: 1.2; text-align: center; color: #444; overflow-wrap: anywhere }
.scan { position: absolute; left: 0.22in; bottom: 0.15in; font-size: 6.5pt; color: #555 }
.sample { position: absolute; left: 0.22in; bottom: 0.32in; font-size: 7pt; font-weight: 700;
  color: #b00020; letter-spacing: .08em }
</style></head><body>
<div class="sheet">
<!--CARD-->
<div class="card"><div class="bar"></div>
  <div class="txt"><div class="biz">{{BUSINESS}}</div><p class="ask">{{ASK}}</p></div>
  <div class="qr">{{QR_SVG}}</div>
  <div class="link">{{LINK_TEXT}}</div>
  {{SAMPLE_MARK}}<div class="scan">Scan with your phone camera</div>
</div>
<!--/CARD-->
</div>
</body></html>

<!DOCTYPE html>
<!-- Counter sign (EXP-A5, T-010). Letter portrait. Double-brace tokens are filled by
     render_card.py. No web fonts, no external requests. The QR encodes ONLY
     the business's Google review link. -->
<html lang="en"><head><meta charset="utf-8">
<title>Review sign: {{BUSINESS}}</title>
<style>
@page { size: 8.5in 11in; margin: 0 }
* { box-sizing: border-box; margin: 0; padding: 0 }
html, body { width: 8.5in; height: 11in; background: #fff }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact;
  font-family: "Liberation Sans", Arial, Helvetica, sans-serif; color: #111;
  position: relative; text-align: center }
.top { position: absolute; left: 0; right: 0; top: 0; height: 0.3in; background: {{ACCENT}} }
.biz { position: absolute; left: 0.75in; right: 0.75in; top: 0.9in; font-size: 30pt;
  font-weight: 700; line-height: 1.1; color: {{ACCENT}}; overflow-wrap: anywhere }
.ask { position: absolute; left: 1in; right: 1in; top: 2.3in; font-size: 20pt; line-height: 1.3 }
.ask .u { overflow-wrap: anywhere; font-weight: 700; font-size: 14pt }
.qr { position: absolute; left: 2.25in; top: 4.4in; width: 4in; height: 4in }
.qr svg { display: block; width: 100%; height: 100% }
.scan { position: absolute; left: 0; right: 0; top: 8.55in; font-size: 16pt; font-weight: 700 }
.link { position: absolute; left: 1in; right: 1in; top: 9.1in; font-size: 11pt; color: #444;
  overflow-wrap: anywhere }
.sample { position: absolute; left: 0; right: 0; top: 9.8in; font-size: 18pt; font-weight: 700;
  color: #b00020; letter-spacing: .1em }
</style></head><body>
<div class="top"></div>
<div class="biz">{{BUSINESS}}</div>
<p class="ask">{{ASK}}</p>
<div class="qr">{{QR_SVG}}</div>
<div class="scan">Scan with your phone camera</div>
<div class="link">{{LINK_TEXT}}</div>
{{SAMPLE_MARK}}
</body></html>

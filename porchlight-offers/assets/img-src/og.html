<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden}body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
background:radial-gradient(50rem 30rem at 82% 10%,rgba(246,166,35,.30),transparent 62%),linear-gradient(160deg,#12294a,#0f2440 55%,#0b1a30);
color:#fff;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px;font-size:30px;font-weight:700;letter-spacing:-.5px}
.brand .accent{color:#f6a623}
h1{font-family:"Iowan Old Style",Georgia,serif;font-size:76px;line-height:1.08;letter-spacing:-1.5px;max-width:18ch;font-weight:600}
h1 em{color:#f6a623;font-style:normal}
.sub{font-size:29px;color:#c6d3e3;margin-top:22px;max-width:26ch}
.row{display:flex;gap:14px;flex-wrap:wrap}
.chip{border:1.5px solid rgba(255,255,255,.25);border-radius:999px;padding:11px 22px;font-size:22px;color:#e4ebf4}
.chip.hot{background:#f6a623;border-color:#f6a623;color:#2a1a02;font-weight:700}
svg{width:52px;height:52px}
</style></head><body>
<div class="brand">
  <svg viewBox="0 0 64 64"><circle cx="32" cy="40" r="13" fill="#f6a623" opacity=".3"/><path d="M10 30 32 11l22 19" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 28v25h32V28" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="40" r="7" fill="#f6a623"/></svg>
  <span>Porchlight<span class="accent">Offers</span></span>
</div>
<div>
  <h1>Sell your house fast for <em>cash</em></h1>
  <p class="sub">Any condition. Any situation. No repairs, no fees, no commissions.</p>
</div>
<div class="row">
  <span class="chip hot">Offer in 24 hours</span>
  <span class="chip">Close in 7 days</span>
  <span class="chip">You pick the date</span>
  <span class="chip">$0 fees</span>
</div>
</body></html>
